AWSTemplateFormatVersion: '2010-09-09'
Description: Bounded alpha runtime IAM access for the existing OpenTofu deployer

# Deploy as a separate stack using an already authorized IAM administrator.
# The execution identity must manage this inline policy on Package4ReleaseOpenTofu;
# the deployer and human login are deliberately not granted that permission here.
# Do not update state-and-deployer.yaml or replace the existing role/trust policy.
# CloudFormation reports CAPABILITY_IAM; this does not deploy alpha resources.

Resources:
  AlphaRuntimeIamAccess:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: AgenticEconomyAlphaRuntimeIamAccess
      Roles:
        - Package4ReleaseOpenTofu
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ManageAlphaRuntimeRoles
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
              - iam:ListRoleTags
              - iam:PutRolePolicy
              - iam:GetRolePolicy
              - iam:DeleteRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:UpdateAssumeRolePolicy
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ae-alpha-package4-k3s'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ae-alpha-package4-backup'
          - Sid: ManageAlphaInstanceProfile
            Effect: Allow
            Action:
              - iam:CreateInstanceProfile
              - iam:DeleteInstanceProfile
              - iam:GetInstanceProfile
              - iam:AddRoleToInstanceProfile
              - iam:RemoveRoleFromInstanceProfile
              - iam:TagInstanceProfile
              - iam:UntagInstanceProfile
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/ae-alpha-package4-k3s'
          - Sid: AttachAlphaHostManagedPolicy
            Effect: Allow
            Action:
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ae-alpha-package4-k3s'
            Condition:
              ArnEquals:
                iam:PolicyARN: !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
          - Sid: AttachAlphaBackupManagedPolicy
            Effect: Allow
            Action:
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ae-alpha-package4-backup'
            Condition:
              ArnEquals:
                iam:PolicyARN: !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup'
          - Sid: ReadApprovedManagedPolicies
            Effect: Allow
            Action:
              - iam:GetPolicy
              - iam:GetPolicyVersion
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
              - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup'
          - Sid: PassAlphaHostRoleToEc2
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ae-alpha-package4-k3s'
            Condition:
              StringEquals:
                iam:PassedToService: ec2.amazonaws.com
          - Sid: PassAlphaBackupRoleToBackup
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ae-alpha-package4-backup'
            Condition:
              StringEquals:
                iam:PassedToService: backup.amazonaws.com

Outputs:
  InlinePolicyName:
    Description: Alpha runtime access added to the existing deployer role
    Value: !Ref AlphaRuntimeIamAccess
