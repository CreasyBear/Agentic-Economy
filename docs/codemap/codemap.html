<script>
"use strict";
const DATA = JSON.parse(document.getElementById("codemap-data").textContent);
const NODES = DATA.nodes, EDGES = DATA.edges, FLOWS = DATA.flows;
const byId = Object.fromEntries(NODES.map(n=>[n.id,n]));
const TYPES = ["ui","service","infra","domain","crosscutting","backend","external"];
const COLOR = {ui:"var(--ui)",service:"var(--service)",infra:"var(--infra)",domain:"var(--domain)",
  crosscutting:"var(--cross)",backend:"var(--backend)",external:"var(--external)"};
const TYPE_NAME = {ui:"UI / routes",service:"Service / adapters",infra:"Infrastructure",domain:"Domain",
  crosscutting:"Cross-cutting",backend:"Durable backend (Convex)",external:"External"};
document.getElementById("genat").textContent = DATA.generated_at;
document.getElementById("commit").textContent = DATA.generated_from_commit.slice(0,8);
document.getElementById("cnt").textContent = NODES.length + " nodes · " + EDGES.length + " edges · " + FLOWS.length + " flows";

// --- legend ---
const legendEl = document.getElementById("legend");
const visible = {}; TYPES.forEach(t=>visible[t]=true);
TYPES.forEach(t=>{
  const d=document.createElement("div"); d.className="leg on"; d.dataset.t=t;
  d.innerHTML = `<span class="sw" style="background:${COLOR[t]}"></span><span>${TYPE_NAME[t]}</span>`;
  d.onclick=()=>{ visible[t]=!visible[t]; d.classList.toggle("on",visible[t]); applyFilters(); };
  legendEl.appendChild(d);
});

// --- SVG setup ---
const svg=document.getElementById("svg"), NS="http://www.w3.org/2000/svg";
const W=1400, H=900;
function el(name,attrs){const e=document.createElementNS(NS,name);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
svg.setAttribute("viewBox",`0 0 ${W} ${H}`);

// --- layout: layered backbones + force relaxation to minimize crossings ---
const P = {}; // id -> {x,y}
const ACCESS = {}; // flow membership per node
FLOWS.forEach((f,fi)=>f.steps.forEach(s=>{(ACCESS[s]=ACCESS[s]||[]).push(fi);}));
const PRIMARY = NODES.filter(n=>n.type!=="external").map(n=>n.id);
const EXTERNAL = NODES.filter(n=>n.type==="external").map(n=>n.id);
// initial layered placement (approximate reading order)
const ORDER = ["frontend","server-adapters","action-registry","customer-request","capability-supply",
  "capability-contract","catalog-registry","discovery","answer","answer-thread","harness",
  "action-invocation","model-gateway","work-tree","study","inquiries","notification-outbox","money",
  "security","convex-backend"];
ORDER.forEach((id,i)=>{ const col=i%6, row=Math.floor(i/6); P[id]={x:180+col*200, y:130+row*170}; });
// radial ring for externals
EXTERNAL.forEach((id,i)=>{ const a=(i/EXTERNAL.length)*Math.PI*2; P[id]={x:W/2+Math.cos(a)*(W/2-110), y:H/2+Math.sin(a)*(H/2-110)}; });
// force relaxation on primary nodes to minimize edge crossings
(function(){
  const adj={}; EDGES.forEach(e=>{ (adj[e.from]=adj[e.from]||[]).push(e.to); (adj[e.to]=adj[e.to]||[]).push(e.from); });
  const ids=PRIMARY, n=ids.length;
  for(let iter=0;iter<260;iter++){
    const K=260;
    // repulsion
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
      const a=P[ids[i]], b=P[ids[j]];
      let dx=a.x-b.x, dy=a.y-b.y; let d2=dx*dx+dy*dy||1; let d=Math.sqrt(d2);
      let f=K*K/(d2+1); let fx=(dx/d)*f*0.5, fy=(dy/d)*f*0.5;
      a.x+=fx; a.y+=fy; b.x-=fx; b.y-=fy;
    }
    // springs along edges
    EDGES.forEach(e=>{const a=P[e.from], b=P[e.to]; if(!a||!b)return;
      let dx=b.x-a.x, dy=b.y-a.y; let d=Math.sqrt(dx*dx+dy*dy)||1; let want=170;
      let f=(d-want)*0.06; let fx=(dx/d)*f, fy=(dy/d)*f;
      a.x+=fx; a.y+=fy; b.x-=fx; b.y-=fy;});
    // keep externals pinned near their ring
    EXTERNAL.forEach(id=>{const p=P[id]; const c={x:W/2,y:H/2}; let a=Math.atan2(p.y-c.y,p.x-c.x);
      const R=Math.min(W,H)/2-80; p.x=c.x+Math.cos(a)*R; p.y=c.y+Math.sin(a)*R;});
    // clamp
    PRIMARY.forEach(id=>{const p=P[id]; p.x=Math.max(70,Math.min(W-70,p.x)); p.y=Math.max(70,Math.min(H-70,p.y));});
  }
  // push externals to boundary
})();

// --- draw edges ---
function drawEdges(){
  svg.querySelectorAll("g.edgeg").forEach(e=>e.remove());
  EDGES.forEach(e=>{
    const a=P[e.from], b=P[e.to]; if(!a||!b)return;
    const g=el("g",{class:"edgeg"}); const line=el("path",{class:"edge"+(e.type) ,d:curve(a,b)});
    g.appendChild(line); svg.appendChild(g);
  });
}
function curve(a,b){const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  return `M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}`;}

// --- draw nodes ---
function drawNodes(){
  NODES.forEach(n=>{
    const p=P[n.id]; if(!p)return;
    const g=el("g",{class:"node",id:"n_"+n.id}); g.dataset.id=n.id; g.dataset.type=n.type;
    g.style.cursor="pointer";
    const body=el("rect",{class:"body",x:-64,y:-26,width:128,height:52,rx:10,ry:10,fill:COLOR[n.type]});
    const ring=el("rect",{class:"ring",x:-67,y:-29,width:134,height:58,rx:12,ry:12,stroke:COLOR[n.type]});
    const t1=el("text",{x:0,y:-2,"text-anchor":"middle"}); t1.textContent=n.id;
    const t2=el("text",{class:"sub",x:0,y:14,"text-anchor":"middle"}); t2.textContent=short(n.type);
    g.appendChild(ring); g.appendChild(body); g.appendChild(t1); g.appendChild(t2);
    g.setAttribute("transform",`translate(${p.x},${p.y})`);
    g.onclick=()=>selectNode(n.id);
    svg.appendChild(g);
  });
}
function short(t){return {ui:"UI",service:"adapter",infra:"infra",domain:"domain",crosscutting:"policy",
  backend:"convex",external:"external"}[t]||t;}

// --- rendering state / highlight ---
let current=null; // {kind:'node'|'flow', id}
function applyOpacity(){
  const sel = current;
  const activeSet = new Set();
  if(sel){
    if(sel.kind==="node"){
      const h = neighbors(sel.id,2);
      h.forEach(x=>activeSet.add(x));
      activeSet.add(sel.id);
    } else {
      FLOWS[sel.id].steps.forEach(s=>activeSet.add(s));
    }
  }
  svg.querySelectorAll(".node").forEach(g=>{
    const id=g.dataset.id; const inSet=activeSet.size?activeSet.has(id):true;
    const vis = visible[g.dataset.type]!==false;
    g.style.display = vis? "":"none";
    g.classList.toggle("faded", activeSet.size? !inSet : false);
    if(vis && (!activeSet.size||inSet)) g.setAttribute("opacity", "1"); else g.setAttribute("opacity","");
  });
  // edges
  svg.querySelectorAll(".edgeg").forEach(g=>{
    g.style.display = "none";
  });
  EDGES.forEach(e=>{
    const a=byId[e.from], b=byId[e.to];
    const group = svg.querySelector('#n_'+e.from)&&svg.querySelector('#n_'+e.to)? (()=>{const ea=svg.querySelector('.edgeg:nth-of-type('+(EDGES.indexOf(e)+1)+')');return null;})():null;
  });
  /*
  // simpler: edges have no stable handle mapping to EDGES here; recompute below
  */
  paintEdges(activeSet, sel && sel.kind==="flow" ? new Set(FLOWS[sel.id].steps) : null);
}
function neighbors(start,depth){
  const adjFrom={},adjTo={}; EDGES.forEach(e=>{(adjFrom[e.from]=adjFrom[e.from]||[]).push(e.to);
    (adjTo[e.to]=adjTo[e.to]||[]).push(e.from);});
  const seen=new Set([start]); let frontier=[start];
  for(let d=0;d<depth;d++){const nf=[];
    frontier.forEach(id=>{((adjFrom[id]||[]).concat(adjTo[id]||[])).forEach(x=>{if(!seen.has(x)){seen.add(x);nf.push(x);}})});
    frontier=nf;}
  return seen;
}
function paintEdges(activeSet, flowSet){
  svg.querySelectorAll(".edgeg").forEach(g=>g.remove());
  EDGES.forEach((e,i)=>{
    const a=P[e.from], b=P[e.to]; if(!a||!b)return;
    const g=el("g",{class:"edgeg"});
    let cls="edge";
    if(flowSet&&flowSet.has(e.from)&&flowSet.has(e.to)) cls="edge flowc";
    else if(activeSet.size&&activeSet.has(e.from)&&activeSet.has(e.to)) cls="edge hot";
    const line=el("path",{class:cls,d:curve(a,b)});
    g.appendChild(line); svg.appendChild(g);
  });
}

// --- selection handlers ---
function selectNode(id){
  current={kind:"node",id:id}; applyOpacity(); renderDetail(id);
}
function selectFlow(fi){
  current={kind:"flow",id:fi}; applyOpacity(); renderFlowDetail(fi);
}
function clearSel(){ current=null; applyOpacity(); renderDetail(null); }
function renderDetail(id){
  const el=document.getElementById("detail");
  if(!id){ el.innerHTML="<div class='sb-title'>Node detail</div><div style='color:var(--muted)'>Click a module to inspect it.</div>"; return; }
  const n=byId[id];
  const up=[],down=[];
  EDGES.forEach(e=>{ if(e.to===id) up.push({id:e.from,type:e.type}); if(e.from===id) down.push({id:e.to,type:e.type}); });
  const flowsNode = (ACCESS[id]||[]).map(fi=>{const f=FLOWS[fi];return f.trigger.slice(0,48)+(f.trigger.length>48?"…":"");});
  let h=`<div class='sb-title'>Module · ${id}</div>`;
  h+=`<h3>${TYPE_NAME[n.type]}</h3>`;
  h+=`<div class="k">Path</div><code>${esc(n.path)}</code>`;
  h+=`<div class="k">Role</div><div>${esc(n.role)}</div>`;
  h+=`<div class="k">Entrypoints</div><ul>`+n.entrypoints.map(e=>`<li><code>${esc(e)}</code></li>`).join("")+`</ul>`;
  h+=`<div class="k">Tests (${n.tests.length})</div><div>`+(n.tests.map(t=>`<span class="chip">${esc(shortName(t))}</span>`)).join("")+`</div>`;
  h+=`<div class="k">Constraints</div><ul>`+n.constraints.map(c=>`<li>${esc(c)}</li>`).join("")+`</ul>`;
  h+=`<div class="k">Evidence</div><ul>`+n.evidence.map(e=>`<li><code>${esc(e)}</code></li>`).join("")+`</ul>`;
  if(up.length){h+=`<div class="k">Upstream callers / dependants</div><div>`+up.map(x=>`<span class="chip" data-jump="${x.id}">${esc(x.id)} ✓${esc(x.type)}</span>`).join("")+`</div>`;}
  if(down.length){h+=`<div class="k">Downstream dependencies</div><div>`+down.map(x=>`<span class="chip" data-jump="${x.id}">${esc(x.id)} ⇒${esc(x.type)}</span>`).join("")+`</div>`;}
  if(flowsNode.length){h+=`<div class="k">Belongs to flows</div><ul>`+flowsNode.map(f=>`<li>${esc(f)}</li>`).join("")+`</ul>`;}
  el.innerHTML=h;
  el.querySelectorAll("[data-jump]").forEach(ch=>ch.onclick=()=>selectNode(ch.dataset.jump));
}
function renderFlowDetail(fi){
  const f=FLOWS[fi];
  const el=document.getElementById("detail");
  let h=`<div class='sb-title'>Flow ${fi+1} of ${FLOWS.length}</div>`;
  h+=`<h3>${esc(f.trigger)}</h3>`;
  h+=`<div class="k">Path</div><div>`+f.steps.map((s,i)=>`<span class="chip">${i+1}. ${esc(s)}</span>`).join(" → ")+`</div>`;
  h+=`<div class="k">Outcome</div><div>${esc(f.outcome)}</div>`;
  el.innerHTML=h;
}
function buildFlows(){
  const el=document.getElementById("flows");
  FLOWS.forEach((f,fi)=>{const b=document.createElement("button");b.className="flow";b.dataset.i=fi;
    b.innerHTML=`<span class="fnum">Flow ${fi+1}</span><br>${esc(f.trigger)}`;
    b.onclick=()=>{el.querySelectorAll(".flow").forEach(x=>x.classList.remove("active"));b.classList.add("active");selectFlow(fi);};
    el.appendChild(b);});
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shortName(p){const parts=p.split("/");return parts[parts.length-1];}
function applyFilters(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  svg.querySelectorAll(".node").forEach(g=>{
    const vis=visible[g.dataset.type]!==false;
    const ok = __omp_shell("q||g.dataset.id.toLowerCase().includes(q);")
    g.style.display=(vis&&ok)?"":"none";
  });
  // re-apply current highlight
  applyOpacity();
}

// --- drag / zoom / pan ---
(function(){
  let dragging=null, ox=0, oy=0;
  svg.addEventListener("mousedown",e=>{
    const t=e.target; const gn=t.closest?.(".node");
    if(gn){ dragging=gn; ox=e.clientX; oy=e.clientY; e.preventDefault(); return; }
    svg.classList.add("dragging"); const m0=svg.getAttribute("viewBox").split(" ").map(Number); panStart={x:e.clientX,y:e.clientY,bx0:m0[0],by0:m0[1],bw:m0[2],bh:m0[3]};
  });
  let panStart=null;
  window.addEventListener("mousemove",e=>{
    if(dragging){ const id=dragging.dataset.id; const dx=(e.clientX-ox),dy=(e.clientY-oy);
      const m=svg.getAttribute("viewBox").split(" ").map(Number); const sc=W/m[2];
      P[id].x+=dx/sc; P[id].y+=dy/sc;
      dragging.setAttribute("transform",`translate(${P[id].x},${P[id].y})`);
      ox=e.clientX; oy=e.clientY; repaintLinesFor(id);
      return; }
    if(panStart){ const m=svg.getAttribute("viewBox").split(" ").map(Number);
      const sc=m[2]/svg.clientWidth; const nx=panStart.bx0-(e.clientX-panStart.x)*sc; const ny=panStart.by0-(e.clientY-panStart.y)*sc;
      svg.setAttribute("viewBox",`${nx} ${ny} ${m[2]} ${m[3]}`); }
  });
  window.addEventListener("mouseup",()=>{dragging=null;panStart=null;svg.classList.remove("dragging");});
  svg.addEventListener("wheel",e=>{e.preventDefault();const m=svg.getAttribute("viewBox").split(" ").map(Number);
    const factor=e.deltaY<0?0.9:1.1; const nw=Math.max(300,Math.min(4000,m[2]*factor));
    const cx=m[0]+m[2]/2, cy=m[1]+m[3]/2; const nh=m[3]*(nw/m[2]);
    svg.setAttribute("viewBox",`${cx-nw/2} ${cy-nh/2} ${nw} ${nh}`);},{passive:false});
  function repaintLinesFor(){ applyOpacity(); }
  document.getElementById("resetView").onclick=()=>svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  document.getElementById("reflow").onclick=()=>{ applyOpacity(); };
})();

// --- search input ---
document.getElementById("search").addEventListener("input",applyFilters);
// click background clears
svg.addEventListener("click",e=>{ if(e.target===svg||e.target.tagName==="rect") {} });
svg.addEventListener("dblclick",()=>{clearSel(); document.getElementById("flows").querySelectorAll(".flow").forEach(x=>x.classList.remove("active"));});

// hide node labels off-type filter initial
buildFlows();
drawNodes();
applyOpacity();
document.getElementById("resetView").click();
</script>
