# Disposable proof only: no host database port, credentials or shared volume.
# Compose scopes every container/network/volume to the caller's project name.
services:
  postgres:
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ledger
      POSTGRES_DB: ledger
      POSTGRES_HOST_AUTH_METHOD: trust
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ledger", "-d", "ledger"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres:/var/lib/postgresql/data
  ledger:
    image: ghcr.io/formancehq/ledger:v2.4.14@sha256:9a2902d8d04c67c8a5f6270fc297f8ca5c6cf288f463dfad3984e5d376179c43
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_URI: postgresql://ledger@postgres/ledger?sslmode=disable
    command:
      - serve
      - --auto-upgrade
      - --worker
      - --schema-enforcement-mode=strict
      - --experimental-features=false
      - --experimental-numscript-interpreter=false
      - --default-page-size=50
      - --max-page-size=1000
  gateway:
    image: ghcr.io/formancehq/gateway:v2.3.1@sha256:239926753312410ee9a602aa0bffe1e5c89cd340540a98a6df58694f3d6e4165
    depends_on: [ledger]
    ports:
      - "127.0.0.1:${AE_NATIVE_MONEY_PORT:-3069}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
volumes:
  postgres: {}
