# Version-update PRs are off (limit 0): each one costs CI minutes and majors need review.
# Security updates still come from the repository's Dependabot security updates setting.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /packages/docs
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
