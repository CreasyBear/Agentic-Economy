name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AE_DEPLOYMENT_ENVIRONMENT: development

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1 --ignore-scripts
      - name: Frozen dependency install
        run: npm ci
      - run: npm run lint
      - run: npm run deps:check
      - run: npm run typecheck
      - run: npm run test:imports
      - run: npm run test:ts-standards

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1 --ignore-scripts
      - name: Frozen dependency install
        run: npm ci
      - run: npm run test:unit
