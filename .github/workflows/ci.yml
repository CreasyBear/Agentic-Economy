name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AE_DEPLOYMENT_ENVIRONMENT: development

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1 --ignore-scripts
      - name: Frozen dependency install
        run: npm ci
      - run: npm run lint
      - run: npm run deps:check
      - run: npm run typecheck
      - run: npm run test:imports
      - run: npm run test:ts-standards

  shard:
    name: unit (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1 --ignore-scripts
      - name: Frozen dependency install
        run: npm ci
      - run: npm run test:unit -- --shard=${{ matrix.shard }}/4

  unit:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All unit shards succeeded
        run: test "${{ needs.shard.result }}" = success
