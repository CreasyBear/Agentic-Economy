name: Kernel release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-proof:
    name: Clean source, contract, browser, and build proof
    if: github.event_name != 'push' || (!contains(github.event.head_commit.message, '[phase3c-hosted-trial]') && !contains(github.event.head_commit.message, '[phase5-consumer-comparison]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1

      - name: Frozen dependency install
        run: npm ci

      - name: Run source release contract
        run: npm run test:release:source

  hosted-proof:
    name: Exact-revision production deploy and authenticated Request readback
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[phase3c-hosted-trial]') && !contains(github.event.head_commit.message, '[phase5-consumer-comparison]')
    needs: source-proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      AE_RELEASE_SOURCE_REVISION: ${{ github.sha }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      AE_CUSTOMER_REQUEST_CLERK_INSTANCE_ID: ${{ secrets.AE_CUSTOMER_REQUEST_CLERK_INSTANCE_ID }}
      AE_CUSTOMER_REQUEST_CLERK_SUBJECT: ${{ secrets.AE_CUSTOMER_REQUEST_CLERK_SUBJECT }}
      AE_CUSTOMER_REQUEST_VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1

      - name: Frozen dependency install for independent readback
        run: npm ci

      - name: Refuse a checkout other than the triggering revision
        run: test "$(git rev-parse HEAD)" = "${AE_RELEASE_SOURCE_REVISION}" && test -z "$(git status --porcelain)"

      - name: Deploy the dual-compatible exact clean source revision
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment="$(npm exec -- tsx tools/release/deploy-customer-request-git-source.ts)"
          echo "deployment_id=$(printf '%s' "${deployment}" | jq -r '.deploymentId')" >> "${GITHUB_OUTPUT}"

      - name: Deploy the exact-revision Convex schema and functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --message "GitHub ${AE_RELEASE_SOURCE_REVISION}"

      - name: Refuse incomplete production execution configuration
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          for key in AE_ROUTE_CALL_SIGNING_SECRET AE_ROUTE_CALL_SIGNING_KEY_ID AE_SANDBOX_PROVIDER_KEY AE_SITE_URL; do
            value="$(npx convex env get "${key}" --prod)"
            if [ -z "${value}" ]; then
              echo "Required production execution setting is missing: ${key}" >&2
              exit 1
            fi
          done

      - name: Register labelled sandbox acceptance supply
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          npx convex run sandboxAcceptanceSupply:seedLabelledSandboxSupply '{"includeComparisonOptions":false}' --prod
          for attempt in $(seq 1 30); do
            graph="$(npx convex run capabilitySupply:queryCapabilityGraph '{"networkId":"ae:public","includeInactive":false,"limit":10}' --prod)"
            ready="$(printf '%s' "${graph}" | jq '[.nodes[]? | select(
              .publicationRef == "offering:sandbox-route-resolver:reference-resolve:v5"
              or .publicationRef == "offering:sandbox-route-quoter:service-quote:v5"
            )] | length')"
            if [ "${ready}" -eq 2 ]; then
              exit 0
            fi
            sleep 2
          done
          echo 'Labelled sandbox capability publications did not become route-ready.' >&2
          exit 1

      - name: Verify exact deployed human and agent Request lifecycle
        env:
          AE_CUSTOMER_REQUEST_BASE_URL: https://agentic-economy-phi.vercel.app
          AE_RELEASE_DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          AE_CUSTOMER_REQUEST_TEXT: Find a labelled sandbox service and tell me what it costs.
          AE_CUSTOMER_REQUEST_FACTS_JSON: '{}'
          AE_CUSTOMER_REQUEST_FINISH: complete
          AE_CUSTOMER_REQUEST_EXPECTED_STEP_COUNT: '2'
          AE_CUSTOMER_REQUEST_EXPECTED_BUSINESSES_JSON: '["Sandbox Route Resolver","Sandbox Route Quoter"]'
          AE_CUSTOMER_REQUEST_EXPECTED_RECIPIENTS_JSON: '[{"name":"Sandbox Route Resolver","purposes":["resolve_sandbox_service_reference"]},{"name":"Sandbox Route Quoter","purposes":["prepare_sandbox_service_quote"]}]'
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:release:hosted

  phase5-source-proof:
    name: Phase 5 exact source, browser, and build proof
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[phase5-consumer-comparison]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      AE_RELEASE_SOURCE_REVISION: ${{ github.sha }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Refuse changes outside the Phase 5 release parcel
        run: |
          while IFS= read -r changed_path; do
            case "${changed_path}" in
              .github/workflows/kernel-release-gate.yml|\
              convex/catalog.ts|\
              convex/consumerComparisonDemo.ts|\
              convex/observability.ts|\
              package.json|\
              src/modules/dev/internal/dev-seed-fixture.ts|\
              src/modules/observability/internal/literals.ts|\
              src/modules/observability/internal/operator-controls.ts|\
              src/routes/compare.tsx|\
              tests/deploy-smoke/consumer-comparison-smoke.spec.ts|\
              tests/imports/customer-request-source-completeness.test.ts|\
              tests/integration/consumer-comparison-demo-seed.test.ts|\
              tests/unit/dev/dev-seed-fixture.test.ts|\
              tests/unit/release/consumer-comparison-evidence.test.ts|\
              tools/release/consumer-comparison-evidence.ts|\
              tools/release/phase5-operator-control.ts|\
              tools/release/run-consumer-comparison-hosted-proof.ts|\
              tools/release/verify-consumer-comparison-evidence.ts)
                ;;
              *)
                echo "Path is outside the Phase 5 release parcel: ${changed_path}" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "${AE_RELEASE_SOURCE_REVISION}^" "${AE_RELEASE_SOURCE_REVISION}")

      - name: Refuse a Phase 5 checkout other than the triggering revision
        run: test "$(git rev-parse HEAD)" = "${AE_RELEASE_SOURCE_REVISION}" && test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1

      - name: Frozen Phase 5 dependency install
        run: npm ci

      - name: Install the Phase 5 browser
        run: npx playwright install --with-deps chromium

      - name: Run the focused Phase 5 source contract
        run: npm run verify:phase5:release-source

      - name: Run the compact and wide Phase 5 browser contract
        run: npm run verify:phase5:browser

      - name: Refuse Phase 5 source or generated-file drift
        run: test "$(git rev-parse HEAD)" = "${AE_RELEASE_SOURCE_REVISION}" && test -z "$(git status --porcelain=v1 --untracked-files=all)"

  phase5-production:
    name: Phase 5 exact-revision hosted comparison proof
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[phase5-consumer-comparison]')
    needs: phase5-source-proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      AE_RELEASE_SOURCE_REVISION: ${{ github.sha }}
      AE_PHASE5_BASE_URL: https://agentic-economy-phi.vercel.app
      AE_PHASE5_ADMIN_SUBJECT: ${{ secrets.AE_CUSTOMER_REQUEST_CLERK_SUBJECT }}
      AE_CUSTOMER_REQUEST_CLERK_SUBJECT: ${{ secrets.AE_CUSTOMER_REQUEST_CLERK_SUBJECT }}
      AE_CUSTOMER_REQUEST_CLERK_INSTANCE_ID: ${{ secrets.AE_CUSTOMER_REQUEST_CLERK_INSTANCE_ID }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1

      - name: Frozen Phase 5 production dependency install
        run: npm ci

      - name: Install the hosted-proof browser
        run: npx playwright install --with-deps chromium

      - name: Bind the exact Phase 5 source identity
        run: |
          test "$(git rev-parse HEAD)" = "${AE_RELEASE_SOURCE_REVISION}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'AE_RELEASE_SOURCE_TREE=%s\n' "${source_tree}" >> "${GITHUB_ENV}"
          printf 'CONSUMER_COMPARISON_EXPECTED_REVISION=%s\n' "${AE_RELEASE_SOURCE_REVISION}" >> "${GITHUB_ENV}"
          printf 'CONSUMER_COMPARISON_EXPECTED_TREE=%s\n' "${source_tree}" >> "${GITHUB_ENV}"

      - name: Deploy the exact clean Phase 5 web source
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment="$(npm exec -- tsx tools/release/deploy-customer-request-git-source.ts)"
          echo "deployment_id=$(printf '%s' "${deployment}" | jq -er '.deploymentId')" >> "${GITHUB_OUTPUT}"

      - name: Deploy the exact Phase 5 Convex schema and functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        # The focused source job already runs project typecheck plus a Convex
        # codegen dry-run. Convex's isolated generated tsconfig lacks the DOM
        # CryptoKey type used by a pre-existing hosted-payment module, so do not
        # let that unrelated wrapper typecheck block this bounded deployment.
        run: npx convex deploy --typecheck=disable --message "GitHub ${AE_RELEASE_SOURCE_REVISION}"

      - name: Refuse lifecycle mutation before exact served-revision readback
        env:
          AE_CUSTOMER_REQUEST_BASE_URL: https://agentic-economy-phi.vercel.app
          AE_RELEASE_DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          AE_CUSTOMER_REQUEST_VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:release:hosted:readback

      - name: Enable public Offering projection through audited admin control
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if ! operator_key="$(npx convex env get AE_SOURCE_WRITE_KEY_OPERATOR --prod 2>/dev/null)" || [ -z "${operator_key}" ]; then
            operator_key="phase5-release-v1:$(openssl rand -hex 32)"
            npx convex env set AE_SOURCE_WRITE_KEY_OPERATOR "${operator_key}" --prod
          fi
          if ! bootstrap_principals="$(npx convex env get ADMIN_BOOTSTRAP_PRINCIPAL_IDS --prod 2>/dev/null)" || [ -z "${bootstrap_principals}" ]; then
            bootstrap_principals="${AE_PHASE5_ADMIN_SUBJECT}"
            npx convex env set ADMIN_BOOTSTRAP_PRINCIPAL_IDS "${bootstrap_principals}" --prod
          fi
          if ! printf ',%s,' "${bootstrap_principals}" | grep -Fq ",${AE_PHASE5_ADMIN_SUBJECT},"; then
            echo 'The configured Phase 5 principal is not admitted for owner bootstrap.' >&2
            exit 1
          fi
          issuer="$(npx convex env get CLERK_JWT_ISSUER_DOMAIN --prod)"
          if [ -z "${operator_key}" ] || [ -z "${issuer}" ] || [ -z "${AE_PHASE5_ADMIN_SUBJECT}" ]; then
            echo 'Phase 5 release administration is not configured.' >&2
            exit 1
          fi
          control="$(
            AE_SOURCE_WRITE_KEY_OPERATOR="${operator_key}" \
            AE_PHASE5_ADMIN_ISSUER="${issuer}" \
            npm exec -- tsx tools/release/phase5-operator-control.ts
          )"
          identity="$(printf '%s' "${control}" | jq -cer '.identity')"
          bootstrap_args="$(printf '%s' "${control}" | jq -cer '.bootstrapArgs')"
          control_args="$(printf '%s' "${control}" | jq -cer '.controlArgs')"
          bootstrap_result="$(npx convex run security:bootstrapOwnerAdmin "${bootstrap_args}" --identity "${identity}" --prod)"
          if ! printf '%s' "${bootstrap_result}" | jq -e '
            (.kind == "ok" and .code == "admin_membership_bootstrapped")
            or (.kind == "error" and .reason == "owner_admin_already_exists")
          ' >/dev/null; then
            printf '%s' "${bootstrap_result}" | jq -c '{kind,code,reason}' >&2
            echo 'Phase 5 owner administration could not be established.' >&2
            exit 1
          fi
          result="$(npx convex run observability:setOperatorControl "${control_args}" --identity "${identity}" --prod)"
          if ! printf '%s' "${result}" | jq -e '.kind == "ok" and .readback.effectiveEnabled == true' >/dev/null; then
            printf '%s' "${result}" | jq -c '{kind,code,reason}' >&2
            echo 'Phase 5 public Offering projection was not enabled.' >&2
            exit 1
          fi

      - name: Seed dedicated labelled Phase 5 comparison inventory
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          bootstrapped="$(npx convex run consumerComparisonDemo:bootstrapLabelledConsumerComparisonBusinesses '{}' --prod)"
          if ! printf '%s' "${bootstrapped}" | jq -e '.kind == "bootstrapped" and .dataLabel == "labelled_demo" and (.seededSlugs | length) == 4' >/dev/null; then
            echo 'Phase 5 labelled comparison businesses were not reconstructed.' >&2
            exit 1
          fi
          seeded="$(npx convex run consumerComparisonDemo:seedLabelledConsumerComparisonDemo '{}' --prod)"
          if ! printf '%s' "${seeded}" | jq -e '.kind == "seeded" and .dataLabel == "labelled_demo" and (.selections | length) == 4 and (.detailUrls | length) == 4' >/dev/null; then
            echo 'Phase 5 labelled comparison inventory was not reconstructed.' >&2
            exit 1
          fi
          printf 'CONSUMER_COMPARISON_SEED_VERSION=%s\n' "$(printf '%s' "${seeded}" | jq -er '.seedVersion')" >> "${GITHUB_ENV}"
          printf 'CONSUMER_COMPARISON_SELECTIONS_JSON=%s\n' "$(printf '%s' "${seeded}" | jq -cer '.selections')" >> "${GITHUB_ENV}"
          printf 'CONSUMER_COMPARISON_DETAIL_URLS_JSON=%s\n' "$(printf '%s' "${seeded}" | jq -cer '.detailUrls')" >> "${GITHUB_ENV}"

      - name: Run and independently verify the hosted Phase 5 proof
        env:
          CONSUMER_COMPARISON_BASE_URL: https://agentic-economy-phi.vercel.app
          CONSUMER_COMPARISON_DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          CONSUMER_COMPARISON_ARTIFACT_DIR: ${{ github.workspace }}/output/phase5-hosted
          CONSUMER_COMPARISON_PACKET_PATH: ${{ github.workspace }}/output/phase5-hosted/consumer-comparison-evidence.json
        run: npm exec -- tsx tools/release/run-consumer-comparison-hosted-proof.ts

      - name: Refuse post-proof source drift
        run: test "$(git rev-parse HEAD)" = "${AE_RELEASE_SOURCE_REVISION}" && test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve the Phase 5 hosted evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase5-consumer-comparison-${{ github.sha }}
          path: output/phase5-hosted
          if-no-files-found: error
          retention-days: 30

  phase3c-source-proof:
    name: Phase 3C clean source and build proof
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[phase3c-hosted-trial]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AE_RELEASE_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Refuse a Phase 3C checkout other than the triggering revision
        run: test "$(git rev-parse HEAD)" = "${AE_RELEASE_SOURCE_REVISION}" && test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1

      - name: Frozen Phase 3C dependency install
        run: npm ci

      - name: Run focused Phase 3C release source gate
        run: npm run verify:phase3c:release-source

      - name: Build exact Phase 3C candidate
        run: |
          build_scratch="$(mktemp -d "${RUNNER_TEMP}/phase3c-build.XXXXXX")"
          git archive "${AE_RELEASE_SOURCE_REVISION}" | tar -x -C "${build_scratch}"
          ln -s "${GITHUB_WORKSPACE}/node_modules" "${build_scratch}/node_modules"
          (
            cd "${build_scratch}"
            npm run build
          )

      - name: Refuse Phase 3C source or generated-file drift
        run: test "$(git rev-parse HEAD)" = "${AE_RELEASE_SOURCE_REVISION}" && test -z "$(git status --porcelain)"

  phase3c-production:
    name: Phase 3C exact-revision Convex deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[phase3c-hosted-trial]')
    needs: phase3c-source-proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      AE_RELEASE_SOURCE_REVISION: ${{ github.sha }}
      AE_RELEASE_GITHUB_RUN_ID: ${{ github.run_id }}
      AE_RELEASE_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
      AE_CUSTOMER_REQUEST_CLERK_SUBJECT: ${{ secrets.AE_CUSTOMER_REQUEST_CLERK_SUBJECT }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1

      - name: Frozen Phase 3C production dependency install
        run: npm ci

      - name: Bind exact Phase 3C source metadata
        run: |
          test "$(git rev-parse HEAD)" = "${AE_RELEASE_SOURCE_REVISION}"
          test -z "$(git status --porcelain)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          source_epoch="$(git show -s --format=%ct HEAD)"
          source_clock_timestamp="$(node --input-type=module -e 'process.stdout.write(new Date(Number(process.argv[1]) * 1000).toISOString())' "${source_epoch}")"
          printf 'AE_RELEASE_SOURCE_TREE=%s\n' "${source_tree}" >> "${GITHUB_ENV}"
          printf 'AE_RELEASE_SOURCE_CLOCK_TIMESTAMP=%s\n' "${source_clock_timestamp}" >> "${GITHUB_ENV}"

      - name: Observe the exact Vercel Git deployment
        id: observe-vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          observation="$(npm exec -- tsx tools/release/observe-vercel-git-source-deployment.ts)"
          deployment_id="$(printf '%s' "${observation}" | jq -er '.deploymentId | select(type == "string" and length > 0)')"
          printf 'deployment_id=%s\n' "${deployment_id}" >> "${GITHUB_OUTPUT}"

      - name: Deploy the exact Phase 3C Convex source
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --typecheck=disable --message "GitHub ${AE_RELEASE_SOURCE_REVISION}"

      - name: Configure exact Phase 3C admission
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "${AE_CUSTOMER_REQUEST_CLERK_SUBJECT}" ]; then
            echo 'Phase 3C evaluator subject is not configured.' >&2
            exit 1
          fi
          recorded_at="$(node --input-type=module -e 'const now = new Date(); now.setMilliseconds(0); process.stdout.write(now.toISOString())')"
          admission_ends_at="$(node --input-type=module -e 'const now = new Date(process.argv[1]); process.stdout.write(new Date(now.getTime() + 4 * 60 * 60 * 1000).toISOString())' "${recorded_at}")"
          admission_args="$(jq -cn \
            --arg evaluatorPrincipalRef "${AE_CUSTOMER_REQUEST_CLERK_SUBJECT}" \
            --arg sourceRevision "${AE_RELEASE_SOURCE_REVISION}" \
            --argjson totalLimit 3 \
            --argjson concurrencyLimit 1 \
            --argjson rateLimit 3 \
            --arg admissionEndsAt "${admission_ends_at}" \
            --arg retainThrough '2026-08-21T00:00:00.000Z' \
            --arg killSwitchOwner 'Phase 3C release owner' \
            --arg recordedAt "${recorded_at}" \
            '{evaluatorPrincipalRef:$evaluatorPrincipalRef,sourceRevision:$sourceRevision,totalLimit:$totalLimit,concurrencyLimit:$concurrencyLimit,rateLimit:$rateLimit,admissionEndsAt:$admissionEndsAt,retainThrough:$retainThrough,killSwitchOwner:$killSwitchOwner,recordedAt:$recordedAt}')"
          policy_result="$(npx convex run hostedPaidOperation:configurePhase3CAdmission "${admission_args}" --prod)"
          if ! printf '%s' "${policy_result}" | jq -e '.kind == "configured" and ((.policyDigest // "") | type == "string" and test("^sha256:[0-9a-f]{64}$"))' >/dev/null; then
            echo 'Phase 3C admission configuration was refused.' >&2
            exit 1
          fi
          policy_digest="$(printf '%s' "${policy_result}" | jq -er '.policyDigest')"
          printf 'AE_PHASE3C_POLICY_DIGEST=%s\n' "${policy_digest}" >> "${GITHUB_ENV}"

      - name: Record Phase 3C Convex deployment receipt
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          compensate_phase3c_admission() {
            status_args="$(jq -cn \
              --arg evaluatorPrincipalRef "${AE_CUSTOMER_REQUEST_CLERK_SUBJECT}" \
              '{evaluatorPrincipalRef:$evaluatorPrincipalRef}')"
            before_shutdown="$(npx convex run hostedPaidOperation:phase3CAdmissionStatus "${status_args}" --prod)" || return 1
            printf '%s' "${before_shutdown}" | jq -e \
              --arg policyDigest "${AE_PHASE3C_POLICY_DIGEST}" \
              --arg sourceRevision "${AE_RELEASE_SOURCE_REVISION}" \
              '.kind == "configured"
                and .state == "enabled"
                and .policyDigest == $policyDigest
                and .sourceRevision == $sourceRevision
                and .bounds == {total:3,concurrency:1,rate:3}' >/dev/null || return 1
            disable_args="$(jq -cn \
              --arg evaluatorPrincipalRef "${AE_CUSTOMER_REQUEST_CLERK_SUBJECT}" \
              --arg policyDigest "${AE_PHASE3C_POLICY_DIGEST}" \
              --arg killSwitchOwner 'Phase 3C release owner' \
              '{evaluatorPrincipalRef:$evaluatorPrincipalRef,policyDigest:$policyDigest,killSwitchOwner:$killSwitchOwner}')"
            disabled_result="$(npx convex run hostedPaidOperation:disablePhase3CAdmission "${disable_args}" --prod)" || return 1
            printf '%s' "${disabled_result}" | jq -e \
              --arg policyDigest "${AE_PHASE3C_POLICY_DIGEST}" \
              '.kind == "disabled" and .policyDigest == $policyDigest' >/dev/null || return 1
            after_shutdown="$(npx convex run hostedPaidOperation:phase3CAdmissionStatus "${status_args}" --prod)" || return 1
            printf '%s' "${after_shutdown}" | jq -e \
              --arg policyDigest "${AE_PHASE3C_POLICY_DIGEST}" \
              --arg sourceRevision "${AE_RELEASE_SOURCE_REVISION}" \
              '.kind == "configured"
                and .state == "disabled"
                and .policyDigest == $policyDigest
                and .sourceRevision == $sourceRevision
                and .bounds == {total:3,concurrency:1,rate:3}' >/dev/null
          }
          receipt_args="$(jq -cn \
            --arg sourceRevision "${AE_RELEASE_SOURCE_REVISION}" \
            --arg sourceTree "${AE_RELEASE_SOURCE_TREE}" \
            --arg githubRunId "${AE_RELEASE_GITHUB_RUN_ID}" \
            --argjson githubRunAttempt "${AE_RELEASE_GITHUB_RUN_ATTEMPT}" \
            --arg sourceClockTimestamp "${AE_RELEASE_SOURCE_CLOCK_TIMESTAMP}" \
            '{sourceRevision:$sourceRevision,sourceTree:$sourceTree,githubRunId:$githubRunId,githubRunAttempt:$githubRunAttempt,sourceClockTimestamp:$sourceClockTimestamp}')"
          receipt_exit=0
          receipt_result="$(npx convex run hostedPaidOperation:recordPhase3CDeploymentReceipt "${receipt_args}" --prod)" || receipt_exit=$?
          if [ "${receipt_exit}" -eq 0 ] && printf '%s' "${receipt_result}" | jq -e '.kind == "recorded" and ((.deploymentName // "") | type == "string" and length > 0)' >/dev/null; then
            exit 0
          fi
          if [ "${receipt_exit}" -eq 0 ]; then receipt_exit=1; fi
          echo 'Phase 3C deployment receipt was not recorded; disabling admission.' >&2
          if ! compensate_phase3c_admission; then
            echo 'Phase 3C admission compensation could not be independently verified.' >&2
          fi
          exit "${receipt_exit}"
