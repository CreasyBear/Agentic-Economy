name: Kernel release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-proof:
    name: Clean source, contract, browser, and build proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1

      - name: Frozen dependency install
        run: npm ci

      - name: Record exact source evidence identity
        run: |
          mkdir -p output/release
          jq -n \
            --arg repositorySha "${GITHUB_SHA}" \
            --arg workflowRun "${GITHUB_RUN_ID}" \
            --arg evidenceClass "source-release-gate" \
            '{repositorySha: $repositorySha, workflowRun: $workflowRun, evidenceClass: $evidenceClass, sanitized: true}' \
            > output/release/source-metadata.json

      - name: Run source release contract
        run: npm run gate:release

      - name: Upload sanitized source release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-source-release-gate
          path: |
            output/release/source-metadata.json
            output/release/unit-vitest.json
            output/release/integration-vitest.json
            output/eval/answer-suite-report.json
          if-no-files-found: error
          retention-days: 14

  hosted-proof:
    name: Exact-revision production deploy and authenticated Request readback
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: source-proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      AE_RELEASE_SOURCE_REVISION: ${{ github.sha }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      AE_CUSTOMER_REQUEST_CLERK_INSTANCE_ID: ${{ secrets.AE_CUSTOMER_REQUEST_CLERK_INSTANCE_ID }}
      AE_CUSTOMER_REQUEST_CLERK_SUBJECT: ${{ secrets.AE_CUSTOMER_REQUEST_CLERK_SUBJECT }}
      AE_WORK_TREE_CLERK_INSTANCE_ID: ${{ secrets.AE_WORK_TREE_CLERK_INSTANCE_ID }}
      AE_WORK_TREE_CLERK_SUBJECT: ${{ secrets.AE_WORK_TREE_CLERK_SUBJECT }}
      AE_WORK_TREE_SETUP_TOKEN: ${{ secrets.AE_WORK_TREE_SETUP_TOKEN }}
      DEPLOY_CONVEX_URL: ${{ secrets.AE_WORK_TREE_DEPLOY_CONVEX_URL }}
      AE_RELEASE_CONVEX_DEPLOYMENT_ID: ${{ secrets.AE_RELEASE_CONVEX_DEPLOYMENT_ID }}
      AE_CUSTOMER_REQUEST_VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      AE_WORK_TREE_EVIDENCE_DIR: output/release/work-tree-parity
      AE_WORK_TREE_TIMEOUT_MS: '180000'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1

      - name: Frozen dependency install for independent readback
        run: npm ci

      - name: Record exact hosted evidence identity
        run: |
          mkdir -p output/release
          jq -n \
            --arg repositorySha "${GITHUB_SHA}" \
            --arg workflowRun "${GITHUB_RUN_ID}" \
            --arg evidenceClass "hosted-release-gate" \
            '{repositorySha: $repositorySha, workflowRun: $workflowRun, evidenceClass: $evidenceClass, sanitized: true}' \
            > output/release/hosted-metadata.json


      - name: Refuse a checkout other than the triggering revision
        run: test "$(git rev-parse HEAD)" = "${AE_RELEASE_SOURCE_REVISION}" && test -z "$(git status --porcelain)"

      - name: Deploy the dual-compatible exact clean source revision
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment="$(npm exec -- tsx tools/release/deploy-customer-request-git-source.ts)"
          echo "deployment_id=$(printf '%s' "${deployment}" | jq -r '.deploymentId')" >> "${GITHUB_OUTPUT}"

      - name: Deploy the exact-revision Convex schema and functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --message "GitHub ${AE_RELEASE_SOURCE_REVISION}"

      - name: Refuse incomplete production execution configuration
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          for key in AE_ROUTE_CALL_SIGNING_SECRET AE_ROUTE_CALL_SIGNING_KEY_ID AE_SANDBOX_PROVIDER_KEY AE_SITE_URL; do
            value="$(npx convex env get "${key}" --prod)"
            if [ -z "${value}" ]; then
              echo "Required production execution setting is missing: ${key}" >&2
              exit 1
            fi
          done

      - name: Register labelled sandbox acceptance supply
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          npx convex run sandboxAcceptanceSupply:seedLabelledSandboxSupply '{"includeComparisonOptions":false}' --prod
          for attempt in $(seq 1 30); do
            graph="$(npx convex run capabilitySupply:queryCapabilityGraph '{"networkId":"ae:public","includeInactive":false,"limit":10}' --prod)"
            ready="$(printf '%s' "${graph}" | jq '[.nodes[]? | select(
              .publicationRef == "offering:sandbox-route-resolver:reference-resolve:v5"
              or .publicationRef == "offering:sandbox-route-quoter:service-quote:v5"
            )] | length')"
            if [ "${ready}" -eq 2 ]; then
              exit 0
            fi
            sleep 2
          done
          echo 'Labelled sandbox capability publications did not become route-ready.' >&2
          exit 1

      - name: Verify exact deployed human and agent Request lifecycle
        env:
          AE_CUSTOMER_REQUEST_BASE_URL: https://agentic-economy-phi.vercel.app
          AE_RELEASE_DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          AE_CUSTOMER_REQUEST_TEXT: Find a labelled sandbox service and tell me what it costs.
          AE_CUSTOMER_REQUEST_FACTS_JSON: '{}'
          AE_CUSTOMER_REQUEST_FINISH: complete
          AE_CUSTOMER_REQUEST_EXPECTED_STEP_COUNT: '2'
          AE_CUSTOMER_REQUEST_EXPECTED_BUSINESSES_JSON: '["Sandbox Route Resolver","Sandbox Route Quoter"]'
          AE_CUSTOMER_REQUEST_EXPECTED_RECIPIENTS_JSON: '[{"name":"Sandbox Route Resolver","purposes":["resolve_sandbox_service_reference"]},{"name":"Sandbox Route Quoter","purposes":["prepare_sandbox_service_quote"]}]'
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:release:hosted

      - name: Verify exact hosted T51 WorkTree parity
        if: success() && env.AE_WORK_TREE_SETUP_TOKEN != '' && env.CLERK_SECRET_KEY != '' && env.AE_WORK_TREE_CLERK_INSTANCE_ID != '' && env.AE_WORK_TREE_CLERK_SUBJECT != '' && env.DEPLOY_CONVEX_URL != '' && env.AE_RELEASE_CONVEX_DEPLOYMENT_ID != ''
        env:
          DEPLOY_BASE_URL: https://agentic-economy-phi.vercel.app
          AE_RELEASE_DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: npm run smoke:work-tree:production:hosted

      - name: Upload sanitized T51 hosted parity evidence
        if: always() && env.AE_WORK_TREE_SETUP_TOKEN != '' && env.CLERK_SECRET_KEY != '' && env.AE_WORK_TREE_CLERK_INSTANCE_ID != '' && env.AE_WORK_TREE_CLERK_SUBJECT != '' && env.DEPLOY_CONVEX_URL != '' && env.AE_RELEASE_CONVEX_DEPLOYMENT_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-t51-hosted-work-tree
          path: |
            output/release/hosted-metadata.json
            output/release/playwright-deploy-smoke.json
            output/release/work-tree-parity/work-tree-parity-evidence.json
            test-results/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload sanitized hosted release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-hosted-release-gate
          path: |
            output/release/hosted-metadata.json
            output/release/playwright-deploy-smoke.json
          if-no-files-found: error
          retention-days: 14
