name: Kernel release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-proof:
    name: Clean source, contract, browser, and build proof
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[phase3c-hosted-trial]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1

      - name: Frozen dependency install
        run: npm ci

      - name: Run source release contract
        run: npm run test:release:source

  hosted-proof:
    name: Exact-revision production deploy and authenticated Request readback
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[phase3c-hosted-trial]')
    needs: source-proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      AE_RELEASE_SOURCE_REVISION: ${{ github.sha }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      AE_CUSTOMER_REQUEST_CLERK_INSTANCE_ID: ${{ secrets.AE_CUSTOMER_REQUEST_CLERK_INSTANCE_ID }}
      AE_CUSTOMER_REQUEST_CLERK_SUBJECT: ${{ secrets.AE_CUSTOMER_REQUEST_CLERK_SUBJECT }}
      AE_CUSTOMER_REQUEST_VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1

      - name: Frozen dependency install for independent readback
        run: npm ci

      - name: Refuse a checkout other than the triggering revision
        run: test "$(git rev-parse HEAD)" = "${AE_RELEASE_SOURCE_REVISION}" && test -z "$(git status --porcelain)"

      - name: Deploy the dual-compatible exact clean source revision
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment="$(npm exec -- tsx tools/release/deploy-customer-request-git-source.ts)"
          echo "deployment_id=$(printf '%s' "${deployment}" | jq -r '.deploymentId')" >> "${GITHUB_OUTPUT}"

      - name: Deploy the exact-revision Convex schema and functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --message "GitHub ${AE_RELEASE_SOURCE_REVISION}"

      - name: Refuse incomplete production execution configuration
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          for key in AE_ROUTE_CALL_SIGNING_SECRET AE_ROUTE_CALL_SIGNING_KEY_ID AE_SANDBOX_PROVIDER_KEY AE_SITE_URL; do
            value="$(npx convex env get "${key}" --prod)"
            if [ -z "${value}" ]; then
              echo "Required production execution setting is missing: ${key}" >&2
              exit 1
            fi
          done

      - name: Register labelled sandbox acceptance supply
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          npx convex run sandboxAcceptanceSupply:seedLabelledSandboxSupply '{"includeComparisonOptions":false}' --prod
          for attempt in $(seq 1 30); do
            graph="$(npx convex run capabilitySupply:queryCapabilityGraph '{"networkId":"ae:public","includeInactive":false,"limit":10}' --prod)"
            ready="$(printf '%s' "${graph}" | jq '[.nodes[]? | select(
              .publicationRef == "offering:sandbox-route-resolver:reference-resolve:v5"
              or .publicationRef == "offering:sandbox-route-quoter:service-quote:v5"
            )] | length')"
            if [ "${ready}" -eq 2 ]; then
              exit 0
            fi
            sleep 2
          done
          echo 'Labelled sandbox capability publications did not become route-ready.' >&2
          exit 1

      - name: Verify exact deployed human and agent Request lifecycle
        env:
          AE_CUSTOMER_REQUEST_BASE_URL: https://agentic-economy-phi.vercel.app
          AE_RELEASE_DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          AE_CUSTOMER_REQUEST_TEXT: Find a labelled sandbox service and tell me what it costs.
          AE_CUSTOMER_REQUEST_FACTS_JSON: '{}'
          AE_CUSTOMER_REQUEST_FINISH: complete
          AE_CUSTOMER_REQUEST_EXPECTED_STEP_COUNT: '2'
          AE_CUSTOMER_REQUEST_EXPECTED_BUSINESSES_JSON: '["Sandbox Route Resolver","Sandbox Route Quoter"]'
          AE_CUSTOMER_REQUEST_EXPECTED_RECIPIENTS_JSON: '[{"name":"Sandbox Route Resolver","purposes":["resolve_sandbox_service_reference"]},{"name":"Sandbox Route Quoter","purposes":["prepare_sandbox_service_quote"]}]'
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:release:hosted

  phase3c-source-proof:
    name: Phase 3C clean source and build proof
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[phase3c-hosted-trial]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AE_RELEASE_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Refuse a Phase 3C checkout other than the triggering revision
        run: test "$(git rev-parse HEAD)" = "${AE_RELEASE_SOURCE_REVISION}" && test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1

      - name: Frozen Phase 3C dependency install
        run: npm ci

      - name: Run focused Phase 3C release source gate
        run: npm run verify:phase3c:release-source

      - name: Build exact Phase 3C candidate
        run: |
          build_scratch="$(mktemp -d "${RUNNER_TEMP}/phase3c-build.XXXXXX")"
          git archive "${AE_RELEASE_SOURCE_REVISION}" | tar -x -C "${build_scratch}"
          ln -s "${GITHUB_WORKSPACE}/node_modules" "${build_scratch}/node_modules"
          (
            cd "${build_scratch}"
            npm run build
          )

      - name: Refuse Phase 3C source or generated-file drift
        run: test "$(git rev-parse HEAD)" = "${AE_RELEASE_SOURCE_REVISION}" && test -z "$(git status --porcelain)"

  phase3c-production:
    name: Phase 3C exact-revision Convex deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[phase3c-hosted-trial]')
    needs: phase3c-source-proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      AE_RELEASE_SOURCE_REVISION: ${{ github.sha }}
      AE_RELEASE_GITHUB_RUN_ID: ${{ github.run_id }}
      AE_RELEASE_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
      AE_CUSTOMER_REQUEST_CLERK_SUBJECT: ${{ secrets.AE_CUSTOMER_REQUEST_CLERK_SUBJECT }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1

      - name: Frozen Phase 3C production dependency install
        run: npm ci

      - name: Bind exact Phase 3C source metadata
        run: |
          test "$(git rev-parse HEAD)" = "${AE_RELEASE_SOURCE_REVISION}"
          test -z "$(git status --porcelain)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          source_epoch="$(git show -s --format=%ct HEAD)"
          source_clock_timestamp="$(node --input-type=module -e 'process.stdout.write(new Date(Number(process.argv[1]) * 1000).toISOString())' "${source_epoch}")"
          printf 'AE_RELEASE_SOURCE_TREE=%s\n' "${source_tree}" >> "${GITHUB_ENV}"
          printf 'AE_RELEASE_SOURCE_CLOCK_TIMESTAMP=%s\n' "${source_clock_timestamp}" >> "${GITHUB_ENV}"

      - name: Observe the exact Vercel Git deployment
        id: observe-vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          observation="$(npm exec -- tsx tools/release/observe-vercel-git-source-deployment.ts)"
          deployment_id="$(printf '%s' "${observation}" | jq -er '.deploymentId | select(type == "string" and length > 0)')"
          printf 'deployment_id=%s\n' "${deployment_id}" >> "${GITHUB_OUTPUT}"

      - name: Deploy the exact Phase 3C Convex source
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --typecheck=disable --message "GitHub ${AE_RELEASE_SOURCE_REVISION}"

      - name: Configure exact Phase 3C admission
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "${AE_CUSTOMER_REQUEST_CLERK_SUBJECT}" ]; then
            echo 'Phase 3C evaluator subject is not configured.' >&2
            exit 1
          fi
          recorded_at="$(node --input-type=module -e 'const now = new Date(); now.setMilliseconds(0); process.stdout.write(now.toISOString())')"
          admission_ends_at="$(node --input-type=module -e 'const now = new Date(process.argv[1]); process.stdout.write(new Date(now.getTime() + 4 * 60 * 60 * 1000).toISOString())' "${recorded_at}")"
          admission_args="$(jq -cn \
            --arg evaluatorPrincipalRef "${AE_CUSTOMER_REQUEST_CLERK_SUBJECT}" \
            --arg sourceRevision "${AE_RELEASE_SOURCE_REVISION}" \
            --argjson totalLimit 3 \
            --argjson concurrencyLimit 1 \
            --argjson rateLimit 3 \
            --arg admissionEndsAt "${admission_ends_at}" \
            --arg retainThrough '2026-08-21T00:00:00.000Z' \
            --arg killSwitchOwner 'Phase 3C release owner' \
            --arg recordedAt "${recorded_at}" \
            '{evaluatorPrincipalRef:$evaluatorPrincipalRef,sourceRevision:$sourceRevision,totalLimit:$totalLimit,concurrencyLimit:$concurrencyLimit,rateLimit:$rateLimit,admissionEndsAt:$admissionEndsAt,retainThrough:$retainThrough,killSwitchOwner:$killSwitchOwner,recordedAt:$recordedAt}')"
          policy_result="$(npx convex run hostedPaidOperation:configurePhase3CAdmission "${admission_args}" --prod)"
          if ! printf '%s' "${policy_result}" | jq -e '.kind == "configured" and ((.policyDigest // "") | type == "string" and test("^sha256:[0-9a-f]{64}$"))' >/dev/null; then
            echo 'Phase 3C admission configuration was refused.' >&2
            exit 1
          fi
          policy_digest="$(printf '%s' "${policy_result}" | jq -er '.policyDigest')"
          printf 'AE_PHASE3C_POLICY_DIGEST=%s\n' "${policy_digest}" >> "${GITHUB_ENV}"

      - name: Record Phase 3C Convex deployment receipt
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          compensate_phase3c_admission() {
            status_args="$(jq -cn \
              --arg evaluatorPrincipalRef "${AE_CUSTOMER_REQUEST_CLERK_SUBJECT}" \
              '{evaluatorPrincipalRef:$evaluatorPrincipalRef}')"
            before_shutdown="$(npx convex run hostedPaidOperation:phase3CAdmissionStatus "${status_args}" --prod)" || return 1
            printf '%s' "${before_shutdown}" | jq -e \
              --arg policyDigest "${AE_PHASE3C_POLICY_DIGEST}" \
              --arg sourceRevision "${AE_RELEASE_SOURCE_REVISION}" \
              '.kind == "configured"
                and .state == "enabled"
                and .policyDigest == $policyDigest
                and .sourceRevision == $sourceRevision
                and .bounds == {total:3,concurrency:1,rate:3}' >/dev/null || return 1
            disable_args="$(jq -cn \
              --arg evaluatorPrincipalRef "${AE_CUSTOMER_REQUEST_CLERK_SUBJECT}" \
              --arg policyDigest "${AE_PHASE3C_POLICY_DIGEST}" \
              --arg killSwitchOwner 'Phase 3C release owner' \
              '{evaluatorPrincipalRef:$evaluatorPrincipalRef,policyDigest:$policyDigest,killSwitchOwner:$killSwitchOwner}')"
            disabled_result="$(npx convex run hostedPaidOperation:disablePhase3CAdmission "${disable_args}" --prod)" || return 1
            printf '%s' "${disabled_result}" | jq -e \
              --arg policyDigest "${AE_PHASE3C_POLICY_DIGEST}" \
              '.kind == "disabled" and .policyDigest == $policyDigest' >/dev/null || return 1
            after_shutdown="$(npx convex run hostedPaidOperation:phase3CAdmissionStatus "${status_args}" --prod)" || return 1
            printf '%s' "${after_shutdown}" | jq -e \
              --arg policyDigest "${AE_PHASE3C_POLICY_DIGEST}" \
              --arg sourceRevision "${AE_RELEASE_SOURCE_REVISION}" \
              '.kind == "configured"
                and .state == "disabled"
                and .policyDigest == $policyDigest
                and .sourceRevision == $sourceRevision
                and .bounds == {total:3,concurrency:1,rate:3}' >/dev/null
          }
          receipt_args="$(jq -cn \
            --arg sourceRevision "${AE_RELEASE_SOURCE_REVISION}" \
            --arg sourceTree "${AE_RELEASE_SOURCE_TREE}" \
            --arg githubRunId "${AE_RELEASE_GITHUB_RUN_ID}" \
            --argjson githubRunAttempt "${AE_RELEASE_GITHUB_RUN_ATTEMPT}" \
            --arg sourceClockTimestamp "${AE_RELEASE_SOURCE_CLOCK_TIMESTAMP}" \
            '{sourceRevision:$sourceRevision,sourceTree:$sourceTree,githubRunId:$githubRunId,githubRunAttempt:$githubRunAttempt,sourceClockTimestamp:$sourceClockTimestamp}')"
          receipt_exit=0
          receipt_result="$(npx convex run hostedPaidOperation:recordPhase3CDeploymentReceipt "${receipt_args}" --prod)" || receipt_exit=$?
          if [ "${receipt_exit}" -eq 0 ] && printf '%s' "${receipt_result}" | jq -e '.kind == "recorded" and ((.deploymentName // "") | type == "string" and length > 0)' >/dev/null; then
            exit 0
          fi
          if [ "${receipt_exit}" -eq 0 ]; then receipt_exit=1; fi
          echo 'Phase 3C deployment receipt was not recorded; disabling admission.' >&2
          if ! compensate_phase3c_admission; then
            echo 'Phase 3C admission compensation could not be independently verified.' >&2
          fi
          exit "${receipt_exit}"
