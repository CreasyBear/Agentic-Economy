name: Kernel release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      confirm_chat_staging_smoke:
        description: 'Confirm the deployed staging host is the exact source revision and the private owner browser session may be used for the chat smoke.'
        required: true
        default: false
        type: boolean
      confirm_live_gateway_spend:
        description: 'Type the run ID below and confirm the production-approved paid gateway smoke may move at most AUD 6.00 total externally (top-up charge plus provider payout).'
        required: true
        default: false
        type: boolean
      live_gateway_run_id:
        description: 'Exact approval identity: ae-release-smoke:<40 lowercase hex source revision>:<unique run token>.'
        required: false
        type: string
      live_gateway_stage:
        description: 'Prepare creates a fresh run-scoped Checkout; complete observes the same run after payment and emits the live receipt.'
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - complete
      live_gateway_prepare_workflow_run_id:
        description: 'Complete only: workflow run ID that produced the exact preparation artifact for this source revision.'
        required: false
        type: string
permissions:
  contents: read
  actions: read

concurrency:
  group: kernel-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-proof:
    name: Clean source, contract, browser, and build proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1 --ignore-scripts

      - name: Frozen dependency install
        run: npm ci

      - name: Install the source-proof Chromium browser
        run: npm exec -- playwright install --with-deps chromium

      - name: Record exact source evidence identity
        run: |
          mkdir -p output/release
          jq -n \
            --arg repositorySha "${GITHUB_SHA}" \
            --arg workflowRun "${GITHUB_RUN_ID}" \
            --arg evidenceClass "source-release-gate" \
            '{repositorySha: $repositorySha, workflowRun: $workflowRun, evidenceClass: $evidenceClass, sanitized: true}' \
          > output/release/source-metadata.json

      - name: Validate the closed deployment manifest
        run: npm run verify:deployment-manifest -- --environment development

      - name: Run focused provider and recovery conformance
        run: npm run test:conformance

      - name: Run deterministic Tool chat conformance
        run: npm run test:chat:conformance

      - name: Prove committed Convex source with an isolated anonymous local backend
        run: npm run verify:convex-generated:anonymous

      - name: Prove anonymous generation did not mutate the source checkout
        run: git diff --exit-code -- convex/_generated

      - name: Verify generated source and pinned release inputs
        run: npm run verify:release-integrity

      # The browser proof boots the real app, which mounts ClerkProvider and
      # clerkMiddleware unconditionally; the Clerk development instance is the
      # only credential this job receives.
      - name: Run source release contract without deployment credentials
        env:
          CLERK_JWT_ISSUER_DOMAIN: https://relative-phoenix-8958.clerk.accounts.dev
          CLERK_PUBLISHABLE_KEY: ${{ secrets.AE_AUTHENTICATED_E2E_CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.AE_AUTHENTICATED_E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.AE_AUTHENTICATED_E2E_CLERK_SECRET_KEY }}
        run: npm run test:release:source:after-codegen

      - name: Upload sanitized source release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-source-release-gate
          path: |
            output/release/source-metadata.json
            output/release/unit-vitest.json
            output/release/integration-vitest.json
            output/release/chat-conformance-vitest.json
          if-no-files-found: error
          retention-days: 14

  fresh-checkout-proof:
    name: Fresh checkout reaches a sellable local sandbox
    needs: []
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Announce deploy-guard target: local-anonymous'
        run: "echo 'target: local-anonymous'"

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1 --ignore-scripts

      - name: Frozen dependency install
        run: npm ci

      - name: Resolve the Convex local backend binary version
        id: convex-backend-version
        run: |
          version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/convex'].version)")
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Cache the Convex local backend binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/convex/binaries
          key: convex-local-backend-${{ runner.os }}-${{ steps.convex-backend-version.outputs.version }}

      - name: Start local stack (anonymous Convex, authenticated Clerk)
        env:
          CONVEX_AGENT_MODE: anonymous
          CLERK_JWT_ISSUER_DOMAIN: https://relative-phoenix-8958.clerk.accounts.dev
          AE_E2E_OWNER_EMAIL: ${{ secrets.AE_AUTHENTICATED_E2E_OWNER_EMAIL }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.AE_AUTHENTICATED_E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.AE_AUTHENTICATED_E2E_CLERK_SECRET_KEY }}
          CI: 'true'
        run: |
          mkdir -p output/fresh-checkout
          npm run dev:local -- --skip-scan --no-doctor > output/fresh-checkout/dev-local.log 2>&1 &
          echo "DEV_LOCAL_PID=$!" >> "${GITHUB_ENV}"
          ready=''
          for _ in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:3024/api/ready > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "${ready}" ]; then
            echo '::error::local stack did not answer http://127.0.0.1:3024/api/ready within 180s'
            tail -n 200 output/fresh-checkout/dev-local.log || true
            exit 1
          fi

      # Agent access consent requires the owner's strict reverification in a
      # browser, so this job proves the anonymous sandbox only; doctor reports
      # the credentialed checks as warn/skipped by design.
      - name: Doctor
        run: |
          npm run --silent ae -- doctor --json --base-url http://127.0.0.1:3024 > output/fresh-checkout/doctor.json
          node -e '
            const fs = require("fs");
            const result = JSON.parse(fs.readFileSync("output/fresh-checkout/doctor.json", "utf8"));
            const groups = result.groups || {};
            const catalogue = (result.checks ?? []).find((c) => c.id === "catalogue");
            const marketRequests = (result.checks ?? []).find((c) => c.id === "market_requests");
            // A fresh checkout with the scan skipped has no directory yet by design: admitted
            // Tools are still discoverable, so a bare catalogue-absent warning does not fail the gate.
            const discoveryFailed = groups.discovery !== "pass" && !(
              groups.discovery === "warn" &&
              catalogue?.code === "catalogue_absent" &&
              marketRequests?.state === "pass"
            );
            const quote = (result.checks ?? []).find((c) => c.id === "quote");
            const quoteState = quote?.state;
            const quoteOk = quote !== undefined && (
              quoteState === "pass" ||
              quoteState === "warn" ||
              (quoteState === "skipped" && quote.code === "loopback_readiness_unprovable")
            );
            if (discoveryFailed || !quoteOk) {
              console.error(JSON.stringify(result, null, 2));
              process.exit(1);
            }
            console.log("doctor groups:", JSON.stringify(groups));
            console.log("catalogue state/code:", JSON.stringify({ state: catalogue?.state, code: catalogue?.code }));
            console.log("quote state/code:", JSON.stringify({ state: quoteState, code: quote.code }));
          '

      - name: Upload the fresh-checkout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-fresh-checkout-proof
          path: output/fresh-checkout/
          if-no-files-found: error
          retention-days: 14

      - name: Stop local stack
        if: always()
        run: |
          if [ -n "${DEV_LOCAL_PID}" ]; then
            kill -TERM -- -"${DEV_LOCAL_PID}" 2>/dev/null || kill -TERM "${DEV_LOCAL_PID}" 2>/dev/null || true
          fi

  chat-staging-proof:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_chat_staging_smoke == true
    name: Opt-in exact-revision Tool chat staging smoke
    needs: source-proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      PLAYWRIGHT_BASE_URL: ${{ vars.AE_CHAT_STAGING_BASE_URL }}
      AE_RELEASE_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1 --ignore-scripts

      - name: Frozen dependency install without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Install the staging browser
        run: npm exec -- playwright install --with-deps chromium

      - name: Write the private owner browser session
        env:
          AE_CHAT_STAGING_OWNER_STORAGE_STATE_JSON: ${{ secrets.AE_CHAT_STAGING_OWNER_STORAGE_STATE_JSON }}
        run: |
          owner_storage_state="${RUNNER_TEMP}/ae-chat-owner-storage-state.json"
          umask 077
          printf '%s' "${AE_CHAT_STAGING_OWNER_STORAGE_STATE_JSON}" > "${owner_storage_state}"
          chmod 600 "${owner_storage_state}"
          echo "SMOKE_OWNER_STORAGE_STATE=${owner_storage_state}" >> "${GITHUB_ENV}"

      - name: Run the exact-revision chat staging smoke
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run smoke:chat:staging

      - name: Upload only the sanitized chat staging result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-chat-staging-smoke
          path: output/release/playwright-chat-staging-smoke.json
          if-no-files-found: error
          retention-days: 14

  authenticated-platform-proof:
    if: github.event_name == 'workflow_dispatch'
    name: Required exact-revision authenticated multi-agent lifecycle proof
    needs: source-proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      AE_AUTHENTICATED_E2E_BASE_URL: ${{ vars.AE_AUTHENTICATED_E2E_BASE_URL }}
      AE_RELEASE_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1 --ignore-scripts

      - name: Frozen dependency install without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Install the authenticated Chromium browser
        run: npm exec -- playwright install --with-deps chromium

      - name: Prove the authenticated two-agent lifecycle
        env:
          AE_E2E_OWNER_EMAIL: ${{ secrets.AE_AUTHENTICATED_E2E_OWNER_EMAIL }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.AE_AUTHENTICATED_E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.AE_AUTHENTICATED_E2E_CLERK_SECRET_KEY }}
        run: npm run test:release:authenticated

  live-gateway-proof:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_live_gateway_spend == true
    name: Opt-in production-approved exact-revision paid gateway smoke
    needs: source-proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NODE_ENV: production
      VERCEL_ENV: production
      AE_CANONICAL_BASE_URL: https://agentic-economy-phi.vercel.app
      AE_CANONICAL_HOST_ALLOWLIST: agentic-economy-phi.vercel.app
      CONVEX_URL: ${{ secrets.AE_RELEASE_CONVEX_URL }}
      VITE_CONVEX_URL: ${{ secrets.AE_RELEASE_CONVEX_URL }}
      AE_RELEASE_CONVEX_URL: ${{ secrets.AE_RELEASE_CONVEX_URL }}
      AE_RELEASE_CONVEX_DEPLOYMENT_ID: ${{ secrets.AE_RELEASE_CONVEX_DEPLOYMENT_ID }}
      AE_CONVEX_SERVER_FUNCTION_TOKEN: ${{ secrets.AE_CONVEX_SERVER_FUNCTION_TOKEN }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CLERK_JWT_ISSUER_DOMAIN }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AE_LLM_MODEL: ${{ vars.AE_LLM_MODEL }}
      AE_CHAT_PROXY_SECRET: ${{ secrets.AE_CHAT_PROXY_SECRET }}
      CDP_API_KEY_ID: ${{ secrets.CDP_API_KEY_ID }}
      CDP_API_KEY_SECRET: ${{ secrets.CDP_API_KEY_SECRET }}
      CDP_WALLET_SECRET: ${{ secrets.CDP_WALLET_SECRET }}
      AE_X402_CDP_ACCOUNT_NAME: ${{ secrets.AE_X402_CDP_ACCOUNT_NAME }}
      AE_X402_CDP_EXPECTED_EVM_ADDRESS: ${{ secrets.AE_X402_CDP_EXPECTED_EVM_ADDRESS }}
      AE_X402_CDP_ACCOUNT_POLICY_ID: ${{ secrets.AE_X402_CDP_ACCOUNT_POLICY_ID }}
      AE_X402_CDP_PROJECT_POLICY_ID: ${{ secrets.AE_X402_CDP_PROJECT_POLICY_ID }}
      AE_X402_CDP_POLICY_RULES_DIGEST: ${{ secrets.AE_X402_CDP_POLICY_RULES_DIGEST }}
      AE_X402_CDP_CREDENTIAL_GENERATION: ${{ secrets.AE_X402_CDP_CREDENTIAL_GENERATION }}
      AE_X402_CUSTODY_ENABLED: "true"
      AE_X402_CUSTODY_MAX_ATOMIC: ${{ secrets.AE_X402_CUSTODY_MAX_ATOMIC }}
      AE_X402_CUSTODY_DAILY_MAX_ATOMIC: ${{ secrets.AE_X402_CUSTODY_DAILY_MAX_ATOMIC }}
      AE_X402_RPC_URLS_JSON: ${{ secrets.AE_X402_RPC_URLS_JSON }}
      AE_SOURCE_WRITE_KEY_BILLING: ${{ secrets.AE_SOURCE_WRITE_KEY_BILLING }}
      AE_SOURCE_WRITE_KEY_PROTECTED: ${{ secrets.AE_SOURCE_WRITE_KEY_PROTECTED }}
      AE_SOURCE_WRITE_KEY_CATALOG: ${{ secrets.AE_SOURCE_WRITE_KEY_CATALOG }}
      AE_SOURCE_WRITE_KEY_OPERATOR: ${{ secrets.AE_SOURCE_WRITE_KEY_OPERATOR }}
      AE_SOURCE_WRITE_KEY_REPAIR: ${{ secrets.AE_SOURCE_WRITE_KEY_REPAIR }}
      AE_SOURCE_WRITE_KEY_SESSION: ${{ secrets.AE_SOURCE_WRITE_KEY_SESSION }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_READBACK_KEY: ${{ secrets.STRIPE_READBACK_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_V2_WEBHOOK_SECRET: ${{ secrets.STRIPE_V2_WEBHOOK_SECRET }}
      STRIPE_AU_INCLUSIVE_GST_TAX_RATE_ID: ${{ secrets.STRIPE_AU_INCLUSIVE_GST_TAX_RATE_ID }}
      AE_FORMANCE_ENVIRONMENT: ${{ vars.AE_FORMANCE_ENVIRONMENT }}
      AE_FORMANCE_GATEWAY_URL: ${{ secrets.AE_FORMANCE_GATEWAY_URL }}
      AE_FORMANCE_LEDGER: ${{ vars.AE_FORMANCE_LEDGER }}
      AE_FORMANCE_REQUEST_TIMEOUT_MS: ${{ vars.AE_FORMANCE_REQUEST_TIMEOUT_MS }}
      AE_FORMANCE_ACCESS_CLIENT_ID: ${{ secrets.AE_FORMANCE_ACCESS_CLIENT_ID }}
      AE_FORMANCE_ACCESS_CLIENT_SECRET: ${{ secrets.AE_FORMANCE_ACCESS_CLIENT_SECRET }}
      AE_PACKAGE5_WRITES_ENABLED: ${{ vars.AE_PACKAGE5_WRITES_ENABLED }}
      AE_SUPPLY_HTTP_CREDENTIALS_ENABLED: ${{ vars.AE_SUPPLY_HTTP_CREDENTIALS_ENABLED }}
      AE_SUPPLY_MCP_OAUTH_ENABLED: ${{ vars.AE_SUPPLY_MCP_OAUTH_ENABLED }}
      AE_PROVIDER_OFFBOARDING_ENABLED: ${{ vars.AE_PROVIDER_OFFBOARDING_ENABLED }}
      AE_INFISICAL_BASE_URL: ${{ vars.AE_INFISICAL_BASE_URL }}
      AE_INFISICAL_CUSTOMER_PROJECT_ID: ${{ vars.AE_INFISICAL_CUSTOMER_PROJECT_ID }}
      AE_INFISICAL_CUSTOMER_ENVIRONMENT: ${{ vars.AE_INFISICAL_CUSTOMER_ENVIRONMENT }}
      AE_INFISICAL_CUSTOMER_SECRET_PATH: ${{ vars.AE_INFISICAL_CUSTOMER_SECRET_PATH }}
      AE_INFISICAL_CUSTOMER_MACHINE_IDENTITY_ID: ${{ vars.AE_INFISICAL_CUSTOMER_MACHINE_IDENTITY_ID }}
      AE_INFISICAL_PLATFORM_PROJECT_ID: ${{ vars.AE_INFISICAL_PLATFORM_PROJECT_ID }}
      AE_INFISICAL_PLATFORM_ENVIRONMENT: ${{ vars.AE_INFISICAL_PLATFORM_ENVIRONMENT }}
      AE_INFISICAL_PLATFORM_SECRET_PATH: ${{ vars.AE_INFISICAL_PLATFORM_SECRET_PATH }}
      AE_INFISICAL_PLATFORM_MACHINE_IDENTITY_ID: ${{ vars.AE_INFISICAL_PLATFORM_MACHINE_IDENTITY_ID }}
      AE_GATEWAY_SMOKE_CONFIRM_LIVE_SPEND: 'true'
      AE_GATEWAY_SMOKE_RUN_ID: ${{ inputs.live_gateway_run_id }}
      AE_GATEWAY_SMOKE_BASE_URL: https://agentic-economy-phi.vercel.app
      AE_GATEWAY_SMOKE_JOB_QUERY: ${{ vars.AE_GATEWAY_SMOKE_JOB_QUERY }}
      AE_GATEWAY_SMOKE_OWNER_QUERY: ${{ vars.AE_GATEWAY_SMOKE_OWNER_QUERY }}
      AE_GATEWAY_SMOKE_INPUT_JSON: ${{ secrets.AE_GATEWAY_SMOKE_INPUT_JSON }}
      AE_GATEWAY_SMOKE_API_KEY: ${{ secrets.AE_GATEWAY_SMOKE_API_KEY }}
      AE_GATEWAY_SMOKE_RELEASE_API_KEY: ${{ secrets.AE_GATEWAY_SMOKE_RELEASE_API_KEY }}
      AE_RELEASE_SOURCE_REVISION: ${{ github.sha }}
      AE_RELEASE_DEPLOYMENT_ID: ${{ secrets.AE_RELEASE_DEPLOYMENT_ID }}
      AE_GATEWAY_SMOKE_OWNER_OPENAPI_DOCUMENT_JSON: ${{ secrets.AE_GATEWAY_SMOKE_OWNER_OPENAPI_DOCUMENT_JSON }}
      AE_GATEWAY_SMOKE_OWNER_OPENAPI_PATH: ${{ vars.AE_GATEWAY_SMOKE_OWNER_OPENAPI_PATH }}
      AE_GATEWAY_SMOKE_OWNER_OPENAPI_METHOD: ${{ vars.AE_GATEWAY_SMOKE_OWNER_OPENAPI_METHOD }}
      AE_GATEWAY_SMOKE_OWNER_CLERK_SESSION_ID: ${{ secrets.AE_GATEWAY_SMOKE_OWNER_CLERK_SESSION_ID }}
      AE_GATEWAY_SMOKE_OWNER_CLERK_USER_ID: ${{ secrets.AE_GATEWAY_SMOKE_OWNER_CLERK_USER_ID }}
      AE_GATEWAY_SMOKE_CONTROL_BUSINESS_ID: ${{ vars.AE_GATEWAY_SMOKE_CONTROL_BUSINESS_ID }}
      AE_GATEWAY_SMOKE_CREDENTIAL_ID: ${{ secrets.AE_GATEWAY_SMOKE_CREDENTIAL_ID }}
      AE_GATEWAY_SMOKE_TOPUP_STAGE: ${{ inputs.live_gateway_stage }}
      AE_GATEWAY_SMOKE_TOPUP_AMOUNT_JSON: ${{ vars.AE_GATEWAY_SMOKE_TOPUP_AMOUNT_JSON }}
      AE_GATEWAY_SMOKE_PAYOUT_IDEMPOTENCY_KEY: ${{ format('{0}:payout', inputs.live_gateway_run_id) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1 --ignore-scripts

      - name: Frozen dependency install
        # Job env carries production secrets; skip lifecycle scripts so install
        # cannot read them (react-doctor/build-pipeline-secret-boundary).
        run: npm ci --ignore-scripts
      - name: Verify production deployment manifest before live smoke
        run: npm run verify:deployment-manifest -- --environment production

      - name: Prepare a run-scoped paid Checkout before any external payment
        if: inputs.live_gateway_stage == 'prepare'
        run: |
          export AE_GATEWAY_SMOKE_PAYOUT_REF="${AE_GATEWAY_SMOKE_RUN_ID}:payout"
          export AE_GATEWAY_SMOKE_PAYOUT_IDEMPOTENCY_KEY="${AE_GATEWAY_SMOKE_RUN_ID}:payout"
          export AE_GATEWAY_SMOKE_APPROVED_AT="$(date -u +%s%3N)"
          npm run smoke:gateway:production -- --receipt output/release/operation-gateway-topup-preparation.json
          echo 'Operator action required: complete the exact Checkout session identified in the preparation artifact before dispatching this workflow again with live_gateway_stage=complete and the same live_gateway_run_id.'

      - name: Upload the exact run-scoped Checkout preparation artifact
        if: inputs.live_gateway_stage == 'prepare'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-gateway-topup-preparation
          path: output/release/operation-gateway-topup-preparation.json
          if-no-files-found: error
          retention-days: 14

      - name: Require the exact preparation workflow run for completion
        if: inputs.live_gateway_stage == 'complete'
        env:
          PREPARATION_WORKFLOW_RUN_ID: ${{ inputs.live_gateway_prepare_workflow_run_id }}
        run: test -n "${PREPARATION_WORKFLOW_RUN_ID}"

      - name: Download the exact same-run Checkout preparation artifact
        if: inputs.live_gateway_stage == 'complete'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.live_gateway_prepare_workflow_run_id }}
          name: release-${{ github.sha }}-${{ inputs.live_gateway_prepare_workflow_run_id }}-gateway-topup-preparation
          path: output/release/gateway-topup-preparation

      - name: Observe same-run paid provider state and emit the strict receipt
        if: inputs.live_gateway_stage == 'complete'
        run: |
          export AE_GATEWAY_SMOKE_PAYOUT_REF="${AE_GATEWAY_SMOKE_RUN_ID}:payout"
          export AE_GATEWAY_SMOKE_PAYOUT_IDEMPOTENCY_KEY="${AE_GATEWAY_SMOKE_RUN_ID}:payout"
          preparation='output/release/gateway-topup-preparation/operation-gateway-topup-preparation.json'
          export AE_GATEWAY_SMOKE_APPROVED_AT="$(node -e 'console.log(Date.parse(process.argv[1]))' "$(jq -er '.approvedAt' "${preparation}")")"
          export AE_GATEWAY_SMOKE_TOPUP_PREPARATION_PATH="${preparation}"
          npm run smoke:gateway:production -- --receipt output/release/operation-gateway-smoke.json

      - name: Independently validate the strict opt-in paid gateway receipt
        if: inputs.live_gateway_stage == 'complete'
        env:
          AE_GATEWAY_SMOKE_BASE_URL: https://agentic-economy-phi.vercel.app
          AE_RELEASE_SOURCE_REVISION: ${{ github.sha }}
          AE_RELEASE_DEPLOYMENT_ID: ${{ secrets.AE_RELEASE_DEPLOYMENT_ID }}
          AE_RELEASE_CONVEX_DEPLOYMENT_ID: ${{ secrets.AE_RELEASE_CONVEX_DEPLOYMENT_ID }}
          AE_RELEASE_CONVEX_URL: ${{ secrets.AE_RELEASE_CONVEX_URL }}
        run: npm run validate:release:gateway -- output/release/operation-gateway-smoke.json

      - name: Upload the validated strict opt-in paid gateway receipt
        if: inputs.live_gateway_stage == 'complete'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-paid-gateway-smoke-receipt
          path: output/release/operation-gateway-smoke.json
          if-no-files-found: error
          retention-days: 14
