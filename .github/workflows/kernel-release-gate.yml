name: Kernel release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      confirm_live_gateway_spend:
        description: 'Type the run ID below and confirm the production-approved paid gateway smoke may move at most USD 6.00 total externally (top-up charge plus provider payout).'
        required: true
        default: false
        type: boolean
      live_gateway_run_id:
        description: 'Exact approval identity: ae-release-smoke:<40 lowercase hex source revision>:<unique run token>.'
        required: false
        type: string
      live_gateway_stage:
        description: 'Prepare creates a fresh run-scoped Checkout; complete observes the same run after payment and emits the live receipt.'
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - complete
      live_gateway_prepare_workflow_run_id:
        description: 'Complete only: workflow run ID that produced the exact preparation artifact for this source revision.'
        required: false
        type: string
permissions:
  contents: read
  actions: read

concurrency:
  group: kernel-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-proof:
    name: Clean source, contract, browser, and build proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1

      - name: Frozen dependency install
        run: npm ci

      - name: Record exact source evidence identity
        run: |
          mkdir -p output/release
          jq -n \
            --arg repositorySha "${GITHUB_SHA}" \
            --arg workflowRun "${GITHUB_RUN_ID}" \
            --arg evidenceClass "source-release-gate" \
            '{repositorySha: $repositorySha, workflowRun: $workflowRun, evidenceClass: $evidenceClass, sanitized: true}' \
          > output/release/source-metadata.json

      - name: Validate the closed deployment manifest
        run: npm run verify:deployment-manifest -- --environment development

      - name: Run focused provider and recovery conformance
        run: npm run test:conformance

      - name: Run source release contract without deployment credentials
        run: npm run test:release:source:after-codegen

      - name: Upload sanitized source release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-source-release-gate
          path: |
            output/release/source-metadata.json
            output/release/unit-vitest.json
            output/release/integration-vitest.json
            output/eval/answer-suite-report.json
          if-no-files-found: error
          retention-days: 14

  hosted-proof:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Exact-revision production Request curated fixture smoke
    needs: source-proof
    outputs:
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      AE_RELEASE_SOURCE_REVISION: ${{ github.sha }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      AE_CUSTOMER_REQUEST_CLERK_INSTANCE_ID: ${{ secrets.AE_CUSTOMER_REQUEST_CLERK_INSTANCE_ID }}
      AE_CUSTOMER_REQUEST_CLERK_SUBJECT: ${{ secrets.AE_CUSTOMER_REQUEST_CLERK_SUBJECT }}
      AE_CUSTOMER_REQUEST_VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NODE_ENV: production
      VERCEL_ENV: production
      AE_CANONICAL_BASE_URL: https://agentic-economy-phi.vercel.app
      AE_CANONICAL_HOST_ALLOWLIST: agentic-economy-phi.vercel.app
      AE_RELEASE_CONVEX_URL: ${{ secrets.AE_RELEASE_CONVEX_URL }}
      AE_RELEASE_CONVEX_DEPLOYMENT_ID: ${{ secrets.AE_RELEASE_CONVEX_DEPLOYMENT_ID }}
      AE_CONVEX_SERVER_FUNCTION_TOKEN: ${{ secrets.AE_CONVEX_SERVER_FUNCTION_TOKEN }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CLERK_JWT_ISSUER_DOMAIN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AE_X402_PAYMENT_CREDENTIAL_REF: ${{ secrets.AE_X402_PAYMENT_CREDENTIAL_REF }}
      AE_X402_PAYMENT_PRIVATE_KEY: ${{ secrets.AE_X402_PAYMENT_PRIVATE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
      AE_SOURCE_WRITE_KEY_INQUIRY: ${{ secrets.AE_SOURCE_WRITE_KEY_INQUIRY }}
      AE_SOURCE_WRITE_KEY_BILLING: ${{ secrets.AE_SOURCE_WRITE_KEY_BILLING }}
      AE_SOURCE_WRITE_KEY_PROTECTED: ${{ secrets.AE_SOURCE_WRITE_KEY_PROTECTED }}
      AE_SOURCE_WRITE_KEY_CLAIM: ${{ secrets.AE_SOURCE_WRITE_KEY_CLAIM }}
      AE_SOURCE_WRITE_KEY_OPERATOR: ${{ secrets.AE_SOURCE_WRITE_KEY_OPERATOR }}
      AE_SOURCE_WRITE_KEY_REPAIR: ${{ secrets.AE_SOURCE_WRITE_KEY_REPAIR }}
      AE_SOURCE_WRITE_KEY_SESSION: ${{ secrets.AE_SOURCE_WRITE_KEY_SESSION }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1

      - name: Frozen dependency install for independent readback
        run: npm ci
      - name: Refuse incomplete target production deployment manifest
        run: npm run verify:deployment-manifest -- --environment production



      - name: Record exact hosted evidence identity
        run: |
          mkdir -p output/release
          jq -n \
            --arg repositorySha "${GITHUB_SHA}" \
            --arg workflowRun "${GITHUB_RUN_ID}" \
            --arg evidenceClass "hosted-request-curated-fixture-smoke" \
            '{repositorySha: $repositorySha, workflowRun: $workflowRun, evidenceClass: $evidenceClass, sanitized: true}' \
            > output/release/hosted-metadata.json


      - name: Refuse a checkout other than the triggering revision
        run: test "$(git rev-parse HEAD)" = "${AE_RELEASE_SOURCE_REVISION}" && test -z "$(git status --porcelain)"

      # Convex 1.42 codegen still resolves and uses deployment credentials with --dry-run.
      - name: Verify committed Convex generated source
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npm run check:convex-codegen

      - name: Deploy the dual-compatible exact clean source revision
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment="$(npm exec -- tsx tools/release/deploy-customer-request-git-source.ts)"
          echo "deployment_id=$(printf '%s' "${deployment}" | jq -r '.deploymentId')" >> "${GITHUB_OUTPUT}"

      - name: Deploy the exact-revision Convex schema and functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --message "GitHub ${AE_RELEASE_SOURCE_REVISION}"
      - name: Bind the exact triggering source revision in production Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex env set AE_RELEASE_SOURCE_REVISION "${AE_RELEASE_SOURCE_REVISION}" --prod

      - name: Refuse incomplete production execution configuration
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          for key in AE_ROUTE_CALL_SIGNING_SECRET AE_ROUTE_CALL_SIGNING_KEY_ID AE_SITE_URL; do
            value="$(npx convex env get "${key}" --prod)"
            if [ -z "${value}" ]; then
              echo "Required production execution setting is missing: ${key}" >&2
              exit 1
            fi
          done

      - name: Seed curated supply and verify the Frankfurter readiness fixture
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          npx convex run curatedProviders:seed '{"runtimeEnvironment":"production"}' --prod
          npx convex run curatedProviders:retireLegacyExaV1 '{}' --prod
          npx convex run capabilitySupplyReadiness:probe \
            '{"publicationRef":"offering:frankfurter-ecb-rates:single-rate:v1","expectedRevision":1}' \
            --prod
          for attempt in $(seq 1 30); do
            graph="$(npx convex run capabilitySupply:queryCapabilityGraph '{"networkId":"ae:public","includeInactive":false,"limit":32}' --prod)"
            ready="$(printf '%s' "${graph}" | jq '[.nodes[]? | select(
              .publicationRef == "offering:frankfurter-ecb-rates:single-rate:v1"
            )] | length')"
            if [ "${ready}" -eq 1 ]; then
              exit 0
            fi
            sleep 2
          done
          echo 'Curated Frankfurter readiness fixture did not become route-ready.' >&2
          exit 1

      - name: Verify curated Exa operation search fixture without provider credentials
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          result="$(npx convex run capabilitySupplyOperations:search \
            '{"query":"Research the latest official guidance on AI agent payments and summarize the sources","limit":10}' \
            --prod)"
          printf '%s' "${result}" | jq -e '
            .kind == "ok"
            and ([.items[].contract.capabilityId] | index("exa.search") != null)
            and ([.items[].contract.capabilityId] | index("exa.contents") != null)
          '

      - name: 'Record limitation: hosted supply checks cover curated fixtures only'
        run: |
          echo 'Limitation: this hosted job exercises only the seeded Frankfurter and Exa fixtures; it does not runtime-select arbitrary provider operations or establish generic provider readiness.'

      - name: Verify exact deployed Request lifecycle against the Frankfurter fixture
        env:
          AE_CUSTOMER_REQUEST_BASE_URL: https://agentic-economy-phi.vercel.app
          AE_RELEASE_DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          AE_CUSTOMER_REQUEST_TEXT: Get the current ECB EUR to USD reference rate.
          AE_CUSTOMER_REQUEST_FACTS_JSON: '{"base":"EUR","quote":"USD"}'
          AE_CUSTOMER_REQUEST_FINISH: complete
          AE_CUSTOMER_REQUEST_EXPECTED_STEP_COUNT: '1'
          AE_CUSTOMER_REQUEST_EXPECTED_BUSINESSES_JSON: '["Frankfurter — ECB rates"]'
          AE_CUSTOMER_REQUEST_EXPECTED_RECIPIENTS_JSON: '[{"name":"Frankfurter — ECB rates","purposes":["retrieve_ecb_reference_rate"]}]'
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:release:hosted:request

      - name: Upload sanitized hosted curated-fixture smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-hosted-request-curated-fixture-smoke
          path: |
            output/release/hosted-metadata.json
            output/release/playwright-deploy-smoke.json
          if-no-files-found: error
          retention-days: 14





  live-gateway-proof:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_live_gateway_spend == true
    name: Opt-in production-approved exact-revision paid gateway smoke
    needs: [source-proof, hosted-proof]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NODE_ENV: production
      VERCEL_ENV: production
      AE_CANONICAL_BASE_URL: https://agentic-economy-phi.vercel.app
      AE_CANONICAL_HOST_ALLOWLIST: agentic-economy-phi.vercel.app
      CONVEX_URL: ${{ secrets.AE_RELEASE_CONVEX_URL }}
      VITE_CONVEX_URL: ${{ secrets.AE_RELEASE_CONVEX_URL }}
      AE_RELEASE_CONVEX_URL: ${{ secrets.AE_RELEASE_CONVEX_URL }}
      AE_RELEASE_CONVEX_DEPLOYMENT_ID: ${{ secrets.AE_RELEASE_CONVEX_DEPLOYMENT_ID }}
      AE_CONVEX_SERVER_FUNCTION_TOKEN: ${{ secrets.AE_CONVEX_SERVER_FUNCTION_TOKEN }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CLERK_JWT_ISSUER_DOMAIN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AE_X402_PAYMENT_CREDENTIAL_REF: ${{ secrets.AE_X402_PAYMENT_CREDENTIAL_REF }}
      AE_X402_PAYMENT_PRIVATE_KEY: ${{ secrets.AE_X402_PAYMENT_PRIVATE_KEY }}
      AE_SOURCE_WRITE_KEY_INQUIRY: ${{ secrets.AE_SOURCE_WRITE_KEY_INQUIRY }}
      AE_SOURCE_WRITE_KEY_BILLING: ${{ secrets.AE_SOURCE_WRITE_KEY_BILLING }}
      AE_SOURCE_WRITE_KEY_PROTECTED: ${{ secrets.AE_SOURCE_WRITE_KEY_PROTECTED }}
      AE_SOURCE_WRITE_KEY_CLAIM: ${{ secrets.AE_SOURCE_WRITE_KEY_CLAIM }}
      AE_SOURCE_WRITE_KEY_OPERATOR: ${{ secrets.AE_SOURCE_WRITE_KEY_OPERATOR }}
      AE_SOURCE_WRITE_KEY_REPAIR: ${{ secrets.AE_SOURCE_WRITE_KEY_REPAIR }}
      AE_SOURCE_WRITE_KEY_SESSION: ${{ secrets.AE_SOURCE_WRITE_KEY_SESSION }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
      AE_GATEWAY_SMOKE_CONFIRM_LIVE_SPEND: 'true'
      AE_GATEWAY_SMOKE_RUN_ID: ${{ inputs.live_gateway_run_id }}
      AE_GATEWAY_SMOKE_BASE_URL: https://agentic-economy-phi.vercel.app
      AE_GATEWAY_SMOKE_JOB_QUERY: ${{ vars.AE_GATEWAY_SMOKE_JOB_QUERY }}
      AE_GATEWAY_SMOKE_OWNER_QUERY: ${{ vars.AE_GATEWAY_SMOKE_OWNER_QUERY }}
      AE_GATEWAY_SMOKE_INPUT_JSON: ${{ secrets.AE_GATEWAY_SMOKE_INPUT_JSON }}
      AE_GATEWAY_SMOKE_API_KEY: ${{ secrets.AE_GATEWAY_SMOKE_API_KEY }}
      AE_GATEWAY_SMOKE_RELEASE_API_KEY: ${{ secrets.AE_GATEWAY_SMOKE_RELEASE_API_KEY }}
      AE_RELEASE_SOURCE_REVISION: ${{ github.sha }}
      AE_RELEASE_DEPLOYMENT_ID: ${{ needs.hosted-proof.outputs.deployment_id }}
      AE_GATEWAY_SMOKE_OWNER_OPENAPI_DOCUMENT_JSON: ${{ secrets.AE_GATEWAY_SMOKE_OWNER_OPENAPI_DOCUMENT_JSON }}
      AE_GATEWAY_SMOKE_OWNER_OPENAPI_PATH: ${{ vars.AE_GATEWAY_SMOKE_OWNER_OPENAPI_PATH }}
      AE_GATEWAY_SMOKE_OWNER_OPENAPI_METHOD: ${{ vars.AE_GATEWAY_SMOKE_OWNER_OPENAPI_METHOD }}
      AE_GATEWAY_SMOKE_OWNER_CLERK_SESSION_ID: ${{ secrets.AE_GATEWAY_SMOKE_OWNER_CLERK_SESSION_ID }}
      AE_GATEWAY_SMOKE_OWNER_CLERK_USER_ID: ${{ secrets.AE_GATEWAY_SMOKE_OWNER_CLERK_USER_ID }}
      AE_GATEWAY_SMOKE_CONTROL_BUSINESS_ID: ${{ vars.AE_GATEWAY_SMOKE_CONTROL_BUSINESS_ID }}
      AE_GATEWAY_SMOKE_CREDENTIAL_ID: ${{ secrets.AE_GATEWAY_SMOKE_CREDENTIAL_ID }}
      AE_GATEWAY_SMOKE_TOPUP_STAGE: ${{ inputs.live_gateway_stage }}
      AE_GATEWAY_SMOKE_TOPUP_AMOUNT_JSON: ${{ vars.AE_GATEWAY_SMOKE_TOPUP_AMOUNT_JSON }}
      AE_GATEWAY_SMOKE_PAYOUT_IDEMPOTENCY_KEY: ${{ format('{0}:payout', inputs.live_gateway_run_id) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Pin the repository package manager
        run: npm install --global npm@11.5.1

      - name: Frozen dependency install
        run: npm ci
      - name: Verify production deployment manifest before live smoke
        run: npm run verify:deployment-manifest -- --environment production

      - name: Prepare a run-scoped paid Checkout before any external payment
        if: inputs.live_gateway_stage == 'prepare'
        run: |
          export AE_GATEWAY_SMOKE_PAYOUT_REF="${AE_GATEWAY_SMOKE_RUN_ID}:payout"
          export AE_GATEWAY_SMOKE_PAYOUT_IDEMPOTENCY_KEY="${AE_GATEWAY_SMOKE_RUN_ID}:payout"
          export AE_GATEWAY_SMOKE_APPROVED_AT="$(date -u +%s%3N)"
          npm run smoke:gateway:production -- --receipt output/release/operation-gateway-topup-preparation.json
          echo 'Operator action required: complete the exact Checkout session identified in the preparation artifact before dispatching this workflow again with live_gateway_stage=complete and the same live_gateway_run_id.'

      - name: Upload the exact run-scoped Checkout preparation artifact
        if: inputs.live_gateway_stage == 'prepare'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-gateway-topup-preparation
          path: output/release/operation-gateway-topup-preparation.json
          if-no-files-found: error
          retention-days: 14

      - name: Require the exact preparation workflow run for completion
        if: inputs.live_gateway_stage == 'complete'
        env:
          PREPARATION_WORKFLOW_RUN_ID: ${{ inputs.live_gateway_prepare_workflow_run_id }}
        run: test -n "${PREPARATION_WORKFLOW_RUN_ID}"

      - name: Download the exact same-run Checkout preparation artifact
        if: inputs.live_gateway_stage == 'complete'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.live_gateway_prepare_workflow_run_id }}
          name: release-${{ github.sha }}-${{ inputs.live_gateway_prepare_workflow_run_id }}-gateway-topup-preparation
          path: output/release/gateway-topup-preparation

      - name: Observe same-run paid provider state and emit the strict receipt
        if: inputs.live_gateway_stage == 'complete'
        run: |
          export AE_GATEWAY_SMOKE_PAYOUT_REF="${AE_GATEWAY_SMOKE_RUN_ID}:payout"
          export AE_GATEWAY_SMOKE_PAYOUT_IDEMPOTENCY_KEY="${AE_GATEWAY_SMOKE_RUN_ID}:payout"
          preparation='output/release/gateway-topup-preparation/operation-gateway-topup-preparation.json'
          export AE_GATEWAY_SMOKE_APPROVED_AT="$(node -e 'console.log(Date.parse(process.argv[1]))' "$(jq -er '.approvedAt' "${preparation}")")"
          export AE_GATEWAY_SMOKE_TOPUP_PREPARATION_PATH="${preparation}"
          npm run smoke:gateway:production -- --receipt output/release/operation-gateway-smoke.json

      - name: Independently validate the strict opt-in paid gateway receipt
        if: inputs.live_gateway_stage == 'complete'
        env:
          AE_GATEWAY_SMOKE_BASE_URL: https://agentic-economy-phi.vercel.app
          AE_RELEASE_SOURCE_REVISION: ${{ github.sha }}
          AE_RELEASE_DEPLOYMENT_ID: ${{ needs.hosted-proof.outputs.deployment_id }}
          AE_RELEASE_CONVEX_DEPLOYMENT_ID: ${{ secrets.AE_RELEASE_CONVEX_DEPLOYMENT_ID }}
          AE_RELEASE_CONVEX_URL: ${{ secrets.AE_RELEASE_CONVEX_URL }}
        run: npm run validate:release:hosted:gateway -- output/release/operation-gateway-smoke.json

      - name: Upload the validated strict opt-in paid gateway receipt
        if: inputs.live_gateway_stage == 'complete'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-paid-gateway-smoke-receipt
          path: output/release/operation-gateway-smoke.json
          if-no-files-found: error
          retention-days: 14