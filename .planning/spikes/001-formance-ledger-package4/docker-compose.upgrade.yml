name: ae-p4-formance-upgrade

volumes:
  postgres:
    name: ae-p4-formance-upgrade-postgres

services:
  postgres:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685

  migrate:
    image: ${AE_FORMANCE_LEDGER_IMAGE:?set AE_FORMANCE_LEDGER_IMAGE}

  worker:
    image: ${AE_FORMANCE_LEDGER_IMAGE:?set AE_FORMANCE_LEDGER_IMAGE}
    environment:
      OTEL_METRICS: "true"
      OTEL_METRICS_KEEP_IN_MEMORY: "true"

  ledger:
    image: ${AE_FORMANCE_LEDGER_IMAGE:?set AE_FORMANCE_LEDGER_IMAGE}
    environment:
      AUTO_UPGRADE: "false"
      EXPERIMENTAL_FEATURES: "false"
      EXPERIMENTAL_EXPORTERS: "false"
      EXPERIMENTAL_NUMSCRIPT_INTERPRETER: "false"
      OTEL_METRICS: "true"
      OTEL_METRICS_KEEP_IN_MEMORY: "true"
      SCHEMA_ENFORCEMENT_MODE: strict
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "--fail", "--silent", "http://localhost:3068/_healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  gateway:
    image: ghcr.io/formancehq/gateway@sha256:eb05d46f3b33a4802929f60e47e933c61885689b8d7ad114e151036b3432a257
